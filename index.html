<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SIMP+</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07070d; --surface:rgba(18,18,30,.72); --surface2:#15151f;
  --border:rgba(255,255,255,.08);
  --accent:#ff2e88; --accent2:#00e5ff; --gold:#ffd166;
  --text:#f2f2f8; --muted:#7a7a92; --hh:60px;
}
html{scrollbar-color:#333 transparent}
body{
  background:var(--bg); color:var(--text);
  font-family:"Unbounded",sans-serif;
  min-height:100vh; overflow-x:hidden;
}
/* blobs de fundo */
.blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:.28;z-index:0;pointer-events:none;animation:blobFloat 18s ease-in-out infinite}
.b1{width:520px;height:520px;background:#ff2e88;top:-160px;left:-120px}
.b2{width:460px;height:460px;background:#5e2bff;bottom:-160px;right:-100px;animation-delay:-6s}
.b3{width:340px;height:340px;background:#00e5ff;top:38%;left:44%;opacity:.14;animation-delay:-12s}
@keyframes blobFloat{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(50px,-40px) scale(1.12)}66%{transform:translate(-40px,50px) scale(.94)}}
body::after{content:"";position:fixed;inset:0;opacity:.03;z-index:9998;pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}

header{height:var(--hh);display:flex;align-items:center;gap:.75rem;padding:0 1.25rem;
  border-bottom:1px solid var(--border);position:sticky;top:0;z-index:200;
  background:rgba(7,7,13,.85);backdrop-filter:blur(14px)}
.logo{font-size:1.4rem;font-weight:900;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;transition:transform .15s}
.logo:active{transform:scale(.94)}
.logo .plus{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.role-badge{font-family:"Space Mono",monospace;font-size:.58rem;padding:.2rem .5rem;border-radius:10px;text-transform:uppercase;font-weight:700;letter-spacing:1px;background:#2a2a3a}
.role-host{background:rgba(255,46,136,.15);color:var(--accent);border:1px solid var(--accent)}
.role-client{background:rgba(0,229,255,.12);color:var(--accent2);border:1px solid var(--accent2)}
.header-mid{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;padding:0 .5rem}
.log-ticker{flex:1;min-width:0;height:30px;overflow:hidden;position:relative;margin:0 .75rem;
  border:1px solid var(--border);border-radius:20px;background:rgba(0,0,0,.4)}
.log-ticker-inner{position:relative;width:100%;height:100%;overflow:hidden}
.cm{font-family:"Space Mono",monospace;font-size:.68rem;line-height:1;display:inline-flex;align-items:center;gap:.35rem;position:absolute;top:50%;left:0;white-space:nowrap;will-change:transform,opacity;pointer-events:none;opacity:0}
.cmu{color:var(--accent);font-weight:700}
.cmt{color:var(--muted)}
.hright{display:flex;align-items:center;gap:.5rem}
.abtn{background:none;border:1px solid var(--border);color:var(--muted);padding:.32rem .8rem;border-radius:20px;
  font-family:"Space Mono",monospace;font-size:.68rem;cursor:pointer;transition:.2s}
.abtn:hover{border-color:var(--accent);color:var(--accent)}
.dropdown{position:relative}
.dropdown-content{display:none;position:absolute;right:0;top:125%;background:var(--surface2);min-width:290px;
  box-shadow:0 10px 30px rgba(0,0,0,.8);z-index:300;border:1px solid var(--border);border-radius:10px;max-height:360px;overflow-y:auto;backdrop-filter:blur(10px)}
.dropdown-content.show{display:block;animation:fdIn .18s ease}
@keyframes fdIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.plist-item{padding:10px;border-bottom:1px solid rgba(255,255,255,.04);display:flex;align-items:center;gap:10px;cursor:pointer;transition:.15s}
.plist-item:hover{background:#1e1e2c}
.plist-thumb{width:48px;height:28px;border-radius:5px;object-fit:cover}
.plist-title{font-size:.72rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.plist-del{background:none;border:none;color:var(--muted);cursor:pointer;padding:5px;border-radius:4px}
.plist-del:hover{color:#ff5e5e;background:rgba(255,94,94,.12)}
.tp{display:flex;align-items:center;gap:.4rem;background:rgba(255,46,136,.1);border:1px solid rgba(255,46,136,.35);
  border-radius:20px;padding:.28rem .75rem;font-family:"Space Mono",monospace;font-size:.68rem;color:var(--accent)}
.tdot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.stat-chip{display:flex;flex-direction:column;align-items:center;background:rgba(0,0,0,.35);border:1px solid var(--border);
  border-radius:10px;padding:.2rem .6rem;line-height:1.2}
.stat-chip b{font-family:"Space Mono",monospace;font-size:.72rem;color:var(--accent2)}
.stat-chip span{font-size:.5rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}

main{display:grid;grid-template-columns:1fr 370px;min-height:calc(100vh - var(--hh));position:relative;z-index:1}
.theater{padding:1.4rem;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:.9rem}
.theater-stage{position:relative;width:100%}
.player-glow{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(55px) saturate(220%);opacity:0;transition:opacity .6s;z-index:0;pointer-events:none;border-radius:14px;transform:scale(1.06)}
.player-glow.active{opacity:.22}
.player-wrap{background:#000;border-radius:14px;overflow:hidden;position:relative;aspect-ratio:16/9;border:1px solid var(--border);width:100%;z-index:2;display:flex;align-items:center;justify-content:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#ytFrame{width:100%;height:100%;border:none;display:block;pointer-events:none}
body.is-admin #ytFrame{pointer-events:auto}
#rawAudio{width:90%;margin:auto;display:none;z-index:5;position:relative}
.eover{position:absolute;inset:0;background:rgba(7,7,13,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7rem;transition:opacity .3s;z-index:3}
.eover.gone{opacity:0;pointer-events:none}
.eover .ei{font-size:2.6rem;opacity:.25;animation:eoverPulse 2.4s ease-in-out infinite}
@keyframes eoverPulse{0%,100%{transform:scale(1);opacity:.25}50%{transform:scale(1.15);opacity:.5}}
.eover p{font-family:"Space Mono",monospace;font-size:.72rem;color:var(--muted);text-align:center;line-height:1.8}
.eover .ec{color:var(--accent);background:var(--surface2);padding:.35rem .85rem;border-radius:6px;font-size:.76rem;display:inline-block;margin-top:.2rem}
.sync-btn{background:linear-gradient(90deg,var(--accent),#b52eff);color:#fff;border:none;padding:10px 22px;border-radius:9px;
  font-weight:700;cursor:pointer;margin-top:10px;display:none;font-family:"Unbounded",sans-serif;font-size:.75rem;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,46,136,.45)}70%{box-shadow:0 0 0 12px transparent}100%{box-shadow:0 0 0 0 transparent}}
.npbar{display:flex;align-items:center;gap:.9rem;position:relative;z-index:2;background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:.8rem 1.1rem;backdrop-filter:blur(8px)}
.npi{flex:1;min-width:0}
.nplbl{font-family:"Space Mono",monospace;font-size:.58rem;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.18em;text-transform:uppercase;margin-bottom:.2rem}
.nptitle{font-size:.95rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.npuser{font-family:"Space Mono",monospace;font-size:.68rem;color:var(--muted)}
.npuser b{color:var(--accent);font-weight:400}
.npnext{font-family:"Space Mono",monospace;font-size:.62rem;color:var(--muted);text-align:right;line-height:1.6;max-width:34%}
.npnext b{color:var(--gold);font-weight:400;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.progressbar{height:4px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden;position:relative;z-index:2;cursor:pointer}
.progressbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;transition:width .4s linear}
.pubctl{display:flex;gap:1rem;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:.9rem 1.2rem;position:relative;z-index:2;backdrop-filter:blur(8px)}
.volrow{display:flex;align-items:center;gap:.5rem;flex:1;min-width:140px}
.volrow label{font-family:"Space Mono",monospace;font-size:.64rem;color:var(--muted);letter-spacing:.08em}
.volrow input[type=range]{flex:1;accent-color:var(--accent);cursor:pointer}
.volnum{font-family:"Space Mono",monospace;font-size:.66rem;min-width:34px;text-align:right;color:var(--accent2)}
.apanel{background:var(--surface);border:1px solid rgba(255,46,136,.25);border-radius:12px;padding:1rem 1.2rem;display:none;flex-direction:column;gap:.7rem;position:relative;z-index:2;backdrop-filter:blur(8px)}
.apanel.show{display:flex}
.aptitle{font-family:"Space Mono",monospace;font-size:.58rem;color:var(--accent);letter-spacing:.15em;text-transform:uppercase}
.aprow{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.cbtn{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:.45rem .9rem;border-radius:8px;
  font-family:"Space Mono",monospace;font-size:.7rem;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:.35rem;white-space:nowrap}
.cbtn:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.cbtn.red:hover{background:#ff5e5e;border-color:#ff5e5e}
.cbtn.cy:hover{background:var(--accent2);border-color:var(--accent2);color:#000}
.cfg-row{display:flex;align-items:center;gap:.9rem;flex-wrap:wrap;background:rgba(0,0,0,.25);padding:.55rem .75rem;border-radius:9px;border:1px solid rgba(255,255,255,.04)}
.cfg-row label{font-family:"Space Mono",monospace;font-size:.62rem;color:var(--text);display:flex;align-items:center;gap:.35rem;cursor:pointer}
.cfg-row input[type=number]{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:5px;padding:.2rem .4rem;width:46px;font-family:"Space Mono",monospace;font-size:.62rem;outline:none}
.cfg-row input[type=checkbox]{accent-color:var(--accent);width:13px;height:13px;cursor:pointer}

.qside{display:flex;flex-direction:column;height:calc(100vh - var(--hh));position:sticky;top:var(--hh);overflow:hidden;background:rgba(10,10,18,.5)}
.tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.tab{flex:1;background:none;border:none;color:var(--muted);font-family:"Space Mono",monospace;font-size:.66rem;font-weight:700;
  padding:.75rem 0;cursor:pointer;text-transform:uppercase;letter-spacing:.1em;border-bottom:2px solid transparent;transition:.15s}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tabpane{display:none;flex-direction:column;flex:1;min-height:0}
.tabpane.on{display:flex}
.user-add-box{display:flex;padding:.7rem 1.1rem;background:var(--surface);border-bottom:1px solid var(--border);gap:.4rem;flex-shrink:0}
.user-add-box input{flex:1;background:rgba(0,0,0,.4);border:1px solid var(--border);border-radius:8px;padding:.55rem .7rem;color:var(--text);
  font-family:"Space Mono",monospace;font-size:.7rem;outline:none;transition:.2s}
.user-add-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,46,136,.12)}
.user-add-box button{background:linear-gradient(90deg,var(--accent),#b52eff);border:none;color:#fff;padding:.55rem 1rem;border-radius:8px;
  font-weight:700;cursor:pointer;font-family:"Unbounded",sans-serif;font-size:.7rem;transition:.15s}
.user-add-box button:hover{filter:brightness(1.15)}
.qlist-wrap{flex:1;position:relative;display:flex;flex-direction:column;overflow:hidden}
#qlistBg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.12;z-index:0;pointer-events:none;transition:background-image .5s}
.qlist{flex:1;overflow-y:auto;padding:.7rem;display:flex;flex-direction:column;gap:.45rem;position:relative;z-index:1}
.qlist::-webkit-scrollbar{width:3px}
.qlist::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.qi{background:rgba(0,0,0,.55);border:1px solid var(--border);border-radius:9px;padding:.55rem .65rem;display:flex;align-items:center;gap:.6rem;
  transition:border-color .15s,transform .15s;animation:qs .22s ease;position:relative;z-index:1}
@keyframes qs{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.qi:hover{border-color:rgba(255,255,255,.15)}
.qi.cur{border-color:var(--accent);background:rgba(255,46,136,.07);box-shadow:0 0 18px rgba(255,46,136,.15)}
.qi.dragging{opacity:.4;border-style:dashed}
.qithumb{width:68px;height:40px;border-radius:6px;background:var(--surface2);overflow:hidden;flex-shrink:0}
.qithumb img{width:100%;height:100%;object-fit:cover;display:block}
.qibody{flex:1;min-width:0}
.qititle{font-size:.74rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.qiuser{font-family:"Space Mono",monospace;font-size:.6rem;color:var(--accent2);margin-top:.1rem}
.qinum{font-family:"Space Mono",monospace;font-size:.66rem;color:var(--muted);flex-shrink:0}
.qidel,.qisave{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.75rem;padding:.15rem .3rem;border-radius:4px;transition:.15s;flex-shrink:0;display:none}
.qi:hover .qidel,.qi:hover .qisave{display:flex}
.qidel:hover{color:#ff5e5e;background:rgba(255,94,94,.12)}
.qisave:hover{color:#5de89a;background:rgba(50,200,100,.12)}
.qempty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;color:var(--muted);text-align:center;padding:2rem}
.qempty .qei{font-size:2rem;opacity:.25}
.qempty p{font-family:"Space Mono",monospace;font-size:.68rem;line-height:1.8}
.qempty .qc{color:var(--accent)}

.ranklist{flex:1;overflow-y:auto;padding:.7rem;display:flex;flex-direction:column;gap:.4rem;position:relative;z-index:1}
.rank-row{display:flex;align-items:center;gap:.6rem;background:rgba(0,0,0,.45);border:1px solid var(--border);border-radius:9px;padding:.5rem .7rem}
.rank-pos{font-family:"Space Mono",monospace;font-weight:700;font-size:.8rem;width:26px;text-align:center;color:var(--muted)}
.rank-row:nth-child(1) .rank-pos{color:var(--gold)}
.rank-row:nth-child(2) .rank-pos{color:#cfd4e2}
.rank-row:nth-child(3) .rank-pos{color:#e0955a}
.rank-name{flex:1;font-family:"Space Mono",monospace;font-size:.72rem;color:var(--accent2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-pts{font-family:"Space Mono",monospace;font-size:.68rem;color:var(--accent)}
.loglist{flex:1;overflow-y:auto;padding:.7rem;display:flex;flex-direction:column;gap:.3rem;position:relative;z-index:1}
.log-row{font-family:"Space Mono",monospace;font-size:.62rem;color:var(--muted);background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.04);border-radius:7px;padding:.4rem .6rem;line-height:1.5;word-break:break-word}
.log-row b{color:var(--accent2);font-weight:400}
.log-row.sys b{color:var(--gold)}

.ovl{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:999;backdrop-filter:blur(6px)}
.ovl.open{display:flex}
.modal{background:var(--surface2);border:1px solid rgba(255,46,136,.3);border-radius:16px;padding:1.8rem;width:340px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.7)}
.modal h2{font-size:1.1rem;font-weight:900;margin-bottom:.3rem}
.modal p{font-family:"Space Mono",monospace;font-size:.68rem;color:var(--muted);margin-bottom:1rem;line-height:1.7}
.bok{background:linear-gradient(90deg,var(--accent),#b52eff);color:#fff;padding:.65rem;border-radius:8px;border:none;
  font-family:"Space Mono",monospace;font-size:.74rem;font-weight:700;cursor:pointer;transition:.15s;width:100%}
.bok:hover{filter:brightness(1.15)}
.bcan{background:var(--surface2);color:var(--text);padding:.6rem;border-radius:8px;border:1px solid var(--border);
  font-family:"Space Mono",monospace;font-size:.72rem;font-weight:700;cursor:pointer;width:100%;margin-top:10px}
.toasts{position:fixed;bottom:1.4rem;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:.4rem;align-items:center;pointer-events:none}
.toast{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:.5rem 1.1rem;
  font-family:"Space Mono",monospace;font-size:.7rem;color:var(--text);white-space:nowrap;animation:tin .3s ease,tout .3s ease 2.4s forwards}
.toast.ok{border-color:rgba(93,232,154,.45);color:#5de89a}
.toast.err{border-color:rgba(255,94,94,.45);color:#ff5e5e}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes tout{to{opacity:0}}
.u-item{display:flex;justify-content:space-between;align-items:center;padding:.5rem;border-bottom:1px solid rgba(255,255,255,.05)}
.u-item:last-child{border-bottom:none}
.u-name{font-family:"Space Mono",monospace;font-size:.72rem;color:var(--accent2);font-weight:700}
.u-btn{background:none;border:1px solid #ff5e5e;color:#ff5e5e;font-family:"Space Mono",monospace;font-size:.58rem;padding:.2rem .5rem;border-radius:5px;cursor:pointer}
.u-btn:hover{background:rgba(255,94,94,.18)}
.u-btn.unban{border-color:#5de89a;color:#5de89a}
.u-btn.unban:hover{background:rgba(50,200,100,.18)}

/* ====== efeitos de tela (confete / emotes) ====== */
.fx-piece{position:fixed;top:-24px;pointer-events:none;z-index:999998;will-change:transform,opacity}
@keyframes fxFall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(115vh) rotate(560deg);opacity:.85}}
.fx-emote{position:fixed;pointer-events:none;z-index:999998;font-size:2.2rem;will-change:transform,opacity}
@keyframes fxEmotePop{0%{transform:scale(0) rotate(-20deg);opacity:0}20%{transform:scale(1.25) rotate(6deg);opacity:1}75%{opacity:1}100%{transform:scale(.8) translateY(30px);opacity:0}}

/* ====== EASTER EGGS (conjunto novo do SIMP+) ====== */
.egg-toast{position:fixed;top:74px;left:50%;transform:translateX(-50%);z-index:999999;background:var(--surface2);border:1px solid var(--accent);
  color:var(--text);padding:.6rem 1.3rem;border-radius:22px;font-family:"Space Mono",monospace;font-size:.72rem;opacity:0;
  animation:eggToastPop 3.2s ease forwards;pointer-events:none;box-shadow:0 10px 40px rgba(0,0,0,.6)}
@keyframes eggToastPop{0%{opacity:0;transform:translateX(-50%) translateY(-10px)}10%{opacity:1;transform:translateX(-50%) translateY(0)}85%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-10px)}}
.egg-canvas{position:fixed;inset:0;z-index:999997;pointer-events:none}

/* 1 TIME FREEZE: inverte as cores e congela com zoom lento */
body.egg-freeze{animation:eggFreezePulse 3.6s ease-in-out}
@keyframes eggFreezePulse{0%{filter:none;transform:scale(1)}12%{filter:invert(1) hue-rotate(180deg);transform:scale(1.015)}50%{filter:invert(1) hue-rotate(180deg) saturate(1.4);transform:scale(1.03)}88%{filter:invert(1) hue-rotate(180deg);transform:scale(1.015)}100%{filter:none;transform:scale(1)}}
.egg-freeze-vig{position:fixed;inset:0;z-index:999996;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 50%,transparent 30%,rgba(0,229,255,.25) 65%,rgba(7,7,13,.9));mix-blend-mode:screen;transition:opacity .5s}
.egg-freeze-vig.on{opacity:1}

/* 2 CHUVA DIGITAL: letras caindo em ciano */
/* 3 RAVE: gradiente cônico girando + hue */
body.egg-rave{animation:eggRaveHue .55s linear infinite}
@keyframes eggRaveHue{0%{filter:hue-rotate(0deg) saturate(1.7)}100%{filter:hue-rotate(360deg) saturate(1.7)}}
.egg-rave-overlay{position:fixed;inset:0;z-index:999996;pointer-events:none;opacity:.85;mix-blend-mode:color-dodge;
  background:conic-gradient(from 0deg,#ff2e88,#00e5ff,#ffd166,#7b2eff,#ff2e88);animation:eggRaveSpin 2.2s linear infinite}
@keyframes eggRaveSpin{from{transform:rotate(0deg) scale(2)}to{transform:rotate(360deg) scale(2)}}
.egg-rave-spin{display:inline-block;animation:eggLogoSpinR .6s linear infinite}
@keyframes eggLogoSpinR{from{transform:rotate(0)}to{transform:rotate(360deg)}}

/* 4 GRAVIDADE ZERO: página flutua e gira devagar */
body.egg-zero{animation:eggZeroFloat 4s ease-in-out}
@keyframes eggZeroFloat{0%{transform:rotate(0) translateY(0)}25%{transform:rotate(1.6deg) translateY(-14px)}50%{transform:rotate(-1.6deg) translateY(8px)}75%{transform:rotate(1deg) translateY(-10px)}100%{transform:rotate(0) translateY(0)}}

/* 5 TV QUEBRADA: RGB split + scanlines */
body.egg-tv{animation:eggTvShake .12s steps(2) infinite}
@keyframes eggTvShake{0%{transform:translate(0);filter:none}25%{transform:translate(-4px,2px);filter:hue-rotate(90deg) saturate(2)}50%{transform:translate(4px,-2px);filter:hue-rotate(-90deg)}75%{transform:translate(-3px,-1px);filter:contrast(1.6)}100%{transform:translate(0);filter:none}}
.egg-tv-overlay{position:fixed;inset:0;z-index:999996;pointer-events:none;mix-blend-mode:overlay;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 1px,transparent 2px 4px)}

/* 6 INVASÃO DE POMBOS */
.fx-pombo{position:fixed;left:-70px;pointer-events:none;z-index:999998;font-size:2.6rem;will-change:transform}
@keyframes fxPomboFly{0%{transform:translateX(0) translateY(0) rotate(0)}50%{transform:translateX(55vw) translateY(-46px) rotate(-8deg)}100%{transform:translateX(115vw) translateY(20px) rotate(6deg)}}

/* 7 BIG HEAD: logo gigante */
.logo.egg-bighead{animation:eggBigHead 2.8s ease-in-out;z-index:999999;position:relative}
@keyframes eggBigHead{0%{transform:scale(1)}18%{transform:scale(7) rotate(-4deg)}55%{transform:scale(7) rotate(3deg)}82%{transform:scale(7) rotate(-2deg)}100%{transform:scale(1)}}

/* 8 TREME TREME: terremoto */
body.egg-quake{animation:eggQuake .35s linear 8}
@keyframes eggQuake{0%,100%{transform:translate(0,0)}20%{transform:translate(-8px,4px)}40%{transform:translate(7px,-5px)}60%{transform:translate(-6px,-3px)}80%{transform:translate(5px,5px)}}

<script>
/* ================= CONFIG ================= */
const TWITCH_CLIENT_ID = "lawe3wmm3jifj7vok0xmixm33pzh72";
const REDIRECT_URI = "https://rimworldo.github.io/SIMP/";
const ADMIN_USERS = ["aceboladoo_","daniloamorimking","omonfredini","gmoninho","roninlinguica","bbeazinhaa","saimo504"];
const CHANNEL = "daenil";
const ROOM_ID = "simpplus-room-" + CHANNEL;
const BOT_NICK = "jonhcreator2";
const BOT_OAUTH = "oauth:m86lajvmo1az9wv7xi0dgpxze1tdsd";
const SITE_URL = REDIRECT_URI;

const EMPTY_SOUNDS = [
  "https://files.catbox.moe/d5u8m3.mp3","https://files.catbox.moe/hxhg2l.mp3",
  "https://files.catbox.moe/xjed0e.mp3","https://files.catbox.moe/szy7ht.mp3",
  "https://files.catbox.moe/sf07ho.mp3","https://files.catbox.moe/petnkc.mp3"
];
const ADD_SOUNDS = [
  "https://user.uploads.dev/file/e73225c881fb859fb35f030a8f207696.mp3",
  "https://user.uploads.dev/file/c703c231e59ac6d670b45468a84831a5.mp3",
  "https://user.uploads.dev/file/809183ff60aa24a5c814009881715c54.mp3"
];
const START_SOUND_URL = ADD_SOUNDS[0];

/* ================= ESTADO ================= */
const QUEUE_STATE_KEY = "simpPlusQueueState";
const STATS_KEY = "simpPlusStats";
const DAILY_KEY = "simpPlusDaily";

let emptySoundAudio = null;
let queue = []; let curIdx = -1; let isAdmin = false; let isHost = false;
let paused = false; let ytReady = false; let ytPlayer = null;
let currentGifUrl = ""; let clientSynced = false;
let simpPlaylist = JSON.parse(localStorage.getItem("simpPlaylist") || "[]");
let myName = ""; let myTwitchName = "";
let config = JSON.parse(localStorage.getItem("simpPlusConfig") || "{}");
if (!config.gifWords) config = { gifWords:3, glow:true, bpm:true, vol:80, emptySound:true, autoSkip:true, maxDuration:5, maxPerViewer:5, fx:true };
let simpsPoints = JSON.parse(localStorage.getItem("simpPoints") || "{}");
let bannedUsers = JSON.parse(localStorage.getItem("simpBannedUsers") || "[]");
let stats = JSON.parse(localStorage.getItem(STATS_KEY) || '{"played":0,"seconds":0}');
let dailyClaims = JSON.parse(localStorage.getItem(DAILY_KEY) || "{}");
let hostPeer = null, clientPeer = null, hostConnection = null, clientConnections = [];
let p2pInitializing = false; let clientCurrentVideoId = null; let clientLastSyncTime = 0;
const SYNC_TOLERANCE_SEC = 5;
let twitchMods = new Set();
let twitchUsers = new Set(JSON.parse(localStorage.getItem("simpTwitchUsers") || "[]"));
let twitchColors = JSON.parse(localStorage.getItem("simpTwitchColors") || "{}");
let syncedActiveUsers = []; let twitchWs = null;
let lastTwitchMessageTime = 0; const TWITCH_COOLDOWN_MS = 2500;
let startSoundPlayed = false; let draggingSeek = false; let queueRestored = false;
let logEvents = []; let dragIdx = -1; let logoClicks = 0;
let duelPending = {}; // user -> {target, amount, expires}

function saveStats(){ try{ localStorage.setItem(STATS_KEY, JSON.stringify(stats)); }catch(e){} }
function saveDaily(){ try{ localStorage.setItem(DAILY_KEY, JSON.stringify(dailyClaims)); }catch(e){} }

/* ================= PERSISTÊNCIA DA FILA ================= */
function saveQueueState(){
  try{
    localStorage.setItem(QUEUE_STATE_KEY, JSON.stringify({
      queue:queue, curIdx:curIdx, paused:paused, gifUrl:currentGifUrl,
      time:getCurrentPlaybackTime(), savedAt:Date.now()
    }));
  }catch(e){}
}
function loadQueueState(){
  try{
    const raw = localStorage.getItem(QUEUE_STATE_KEY); if(!raw) return null;
    const d = JSON.parse(raw);
    if(!d || !Array.isArray(d.queue)) return null;
    return d;
  }catch(e){ return null; }
}
function getCurrentPlaybackTime(){
  if(curIdx < 0 || !queue[curIdx]) return 0;
  const isMp3 = /\.(mp3|wav|ogg|m4a)$/i.test(queue[curIdx].videoId);
  const rawAudio = document.getElementById("rawAudio");
  if(isMp3 && rawAudio) return rawAudio.currentTime || 0;
  try{ if(ytReady && ytPlayer && ytPlayer.getCurrentTime) return ytPlayer.getCurrentTime() || 0; }catch(e){}
  return 0;
}

/* ================= UTIL ================= */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function sanitizeColor(c){
  if(!c) return "";
  if(c.match(/^#[0-9a-fA-F]{3,8}$/) || c.match(/^[a-zA-Z]+$/)) return c;
  return "#ff2e88";
}
function fmtTime(t){ const m = Math.floor(t/60), s = Math.floor(t%60).toString().padStart(2,"0"); return m+":"+s; }
function fmtHours(sec){ const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60); return h > 0 ? h+"h"+(m>0?m+"m":"") : m+"m"; }
function toast(msg, type){
  const c = document.getElementById("toasts");
  const t = document.createElement("div");
  t.className = "toast " + (type||""); t.textContent = msg; c.appendChild(t);
  setTimeout(function(){ t.remove(); }, 3000);
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function cleanTitleForGif(title){
  return title.toLowerCase().replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim()
    .split(" ").slice(0, config.gifWords).join(" ");
}
function getUserPoints(u){ return simpsPoints[u] || 0; }
function addPoints(u, amt){
  if(!u || !isHost) return;
  simpsPoints[u] = (simpsPoints[u] || 0) + amt;
  localStorage.setItem("simpPoints", JSON.stringify(simpsPoints));
}
function spendPoints(u, amt){
  if(!u || getUserPoints(u) < amt) return false;
  simpsPoints[u] -= amt;
  localStorage.setItem("simpPoints", JSON.stringify(simpsPoints));
  return true;
}

/* ================= EVENT LOGS (aba 📜) ================= */
function pushEvent(kind, user, text){
  logEvents.unshift({ kind:kind, user:user, text:text, time:new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}) });
  if(logEvents.length > 80) logEvents.pop();
  renderLogs();
}
function renderLogs(){
  const el = document.getElementById("logList");
  if(!el) return;
  if(logEvents.length === 0){
    el.innerHTML = '<div style="color:var(--muted);font-size:.65rem;text-align:center;padding:2rem;font-family:\'Space Mono\'">Nada por aqui ainda.</div>';
    return;
  }
  el.innerHTML = logEvents.map(function(ev){
    return '<div class="log-row ' + (ev.kind==="sys"?"sys":"") + '"><span style="color:#444">[' + ev.time + ']</span> <b>' + esc(ev.user) + '</b> ' + esc(ev.text) + '</div>';
  }).join("");
}

/* ================= ESTATÍSTICAS ================= */
function updateStatChips(){
  document.getElementById("statPlayed").textContent = stats.played || 0;
  document.getElementById("statTime").textContent = fmtHours(stats.seconds || 0);
  document.getElementById("statClients").textContent = isHost
    ? clientConnections.filter(function(c){ return c.open; }).length
    : syncedActiveUsers.length;
}
setInterval(function(){
  if(isHost && curIdx >= 0 && !paused){
    stats.seconds = (stats.seconds || 0) + 1;
    saveStats();
  }
  updateStatChips();
}, 1000);

/* ================= AUTH TWITCH ================= */
window.onload = function(){ checkTwitchAuth(); };
window.addEventListener("beforeunload", function(){ if(isHost) saveQueueState(); });

function checkTwitchAuth(){
  const hash = window.location.hash;
  const stored = localStorage.getItem("simpTwitchToken");
  if(hash && hash.includes("access_token")){
    const params = new URLSearchParams(hash.substring(1));
    const token = params.get("access_token");
    window.location.hash = "";
    localStorage.setItem("simpTwitchToken", token);
    fetchTwitchUser(token);
  } else if(stored){ fetchTwitchUser(stored); }
  else document.getElementById("twitchLoginOvl").classList.add("open");
}

async function fetchTwitchUser(token){
  document.getElementById("twitchLoginOvl").classList.add("open");
  document.querySelector("#twitchLoginOvl h2").innerHTML = "SIMP<span class='plus'>+</span>";
  document.querySelector("#twitchLoginOvl p").textContent = "Validando sessão...";
  document.getElementById("twitchLoginBtn").style.display = "none";
  try{
    const res = await fetch("https://api.twitch.tv/helix/users", {
      headers:{ Authorization:"Bearer "+token, "Client-Id":TWITCH_CLIENT_ID }
    });
    if(res.status === 401) throw new Error("Token expirado");
    const data = await res.json();
    if(data.data && data.data.length > 0){
      myName = data.data[0].login.toLowerCase();
      if(bannedUsers.includes(myName)){ executeBanLoop(); return; }
      document.getElementById("twitchLoginOvl").classList.remove("open");
      assignRolesAndStart();
    } else throw new Error("Usuário não encontrado");
  }catch(e){
    localStorage.removeItem("simpTwitchToken");
    toast("Sessão expirada. Faça login novamente.", "err");
    document.querySelector("#twitchLoginOvl p").textContent = "Login com a Twitch para entrar na sala.";
    document.getElementById("twitchLoginBtn").style.display = "block";
  }
}

document.getElementById("twitchLoginBtn").addEventListener("click", function(){
  window.location.href = "https://id.twitch.tv/oauth2/authorize?client_id=" + TWITCH_CLIENT_ID +
    "&redirect_uri=" + encodeURIComponent(REDIRECT_URI) + "&response_type=token&scope=user:read:email";
});
document.getElementById("logoutBtn").addEventListener("click", function(){
  localStorage.removeItem("simpTwitchToken");
  window.location.reload();
});

/* ================= BAN ================= */
function executeBanLoop(){
  document.body.innerHTML = '<div style="display:flex;height:100vh;background:#000;color:#ff2e88;align-items:center;justify-content:center;flex-direction:column;font-family:monospace;text-transform:uppercase;"><span style="font-size:2rem;font-weight:bold">ACESSO NEGADO</span><span style="font-size:.8rem;color:#555;margin-top:10px">banido do SIMP+</span></div>';
  setTimeout(function(){ try{ window.close(); }catch(e){} window.location.href = "about:blank"; }, 100);
}

function assignRolesAndStart(){
  document.getElementById("userProfileTag").innerHTML = '<div class="tdot"></div>' + esc(myName);
  const PRIMARY_HOST = "nada";
  const SECONDARY_HOST = "daenil";

  if(myName === PRIMARY_HOST){
    isAdmin = true; isHost = true;
    setRoleHost(); startAsHost();
  } else if(myName === SECONDARY_HOST){
    isAdmin = true; toggleAdmin(true);
    setRoleBadge("ADMIN (tentando host)", "#ffb347");
    document.getElementById("usersBtn").style.display = "block";
    startAsClient();
    setTimeout(function(){
      if(!isHost && (!hostConnection || !hostConnection.open)){
        destroyPeers();
        clientCurrentVideoId = null; clientSynced = false; p2pInitializing = false;
        isHost = true; isAdmin = true;
        setRoleHost(); toggleAdmin(true);
        document.getElementById("eover").classList.add("gone");
        document.getElementById("eoverText").innerHTML = "Host iniciado!<br>Adicione vídeos à fila.";
        startAsHost();
        toast("Você é o HOST agora", "ok");
      }
    }, 5000);
  } else if(ADMIN_USERS.includes(myName)){
    isAdmin = true; toggleAdmin(true);
    setRoleBadge("ADMIN", "#ffb347");
    document.getElementById("usersBtn").style.display = "block";
    startAsClient();
  } else {
    setRoleBadge("🎧 CLIENT", "");
    document.getElementById("roleBadge").className = "role-badge role-client";
    startAsClient();
  }
}
function setRoleHost(){
  const b = document.getElementById("roleBadge");
  b.textContent = "HOST (" + myName + ")";
  b.className = "role-badge role-host"; b.style = "";
  document.getElementById("usersBtn").style.display = "block";
  toggleAdmin(true);
}
function setRoleBadge(txt, color){
  const b = document.getElementById("roleBadge");
  b.textContent = txt;
  if(color){
    b.style.background = color + "33"; b.style.color = color; b.style.borderColor = color;
  }
}

function isUserAdminRole(u){
  const l = u.toLowerCase();
  return l === "daenil" || ADMIN_USERS.includes(l) || twitchMods.has(l);
}

function banUser(target){
  if(!isHost) return;
  target = target.toLowerCase().replace("@","");
  if(target === myName || ADMIN_USERS.includes(target) || target === "daenil"){ toast("Não pode banir este usuário!", "err"); return; }
  if(!bannedUsers.includes(target)){
    bannedUsers.push(target);
    localStorage.setItem("simpBannedUsers", JSON.stringify(bannedUsers));
  }
  clientConnections.forEach(function(c){
    if(c.metadata && c.metadata.user === target){
      try{ c.send({ type:"banned" }); }catch(e){}
      setTimeout(function(){ try{ c.close(); }catch(e){} }, 400);
    }
  });
  pushEvent("sys", "SISTEMA", "🔨 " + target + " foi banido");
  renderUsersModal(); broadcastState();
}
function unbanUser(target){
  if(!isHost) return;
  target = target.toLowerCase().replace("@","");
  bannedUsers = bannedUsers.filter(function(u){ return u !== target; });
  localStorage.setItem("simpBannedUsers", JSON.stringify(bannedUsers));
  pushEvent("sys", "SISTEMA", "✅ " + target + " foi desbanido");
  renderUsersModal(); broadcastState();
}

document.getElementById("usersBtn").addEventListener("click", function(){ renderUsersModal(); document.getElementById("usersOvl").classList.add("open"); });
document.getElementById("usersClose").addEventListener("click", function(){ document.getElementById("usersOvl").classList.remove("open"); });

function renderUsersModal(){
  const activeDiv = document.getElementById("activeUsersContent");
  const bannedDiv = document.getElementById("bannedUsersContent");
  const bannedSec = document.getElementById("bannedSection");
  activeDiv.innerHTML = "";
  let current = isHost
    ? clientConnections.filter(function(c){ return c.open && c.metadata; }).map(function(c){ return c.metadata.user; })
    : syncedActiveUsers;
  if(current.length === 0){
    activeDiv.innerHTML = '<div style="color:var(--muted);font-size:.68rem;text-align:center;font-family:\'Space Mono\'">Nenhum cliente conectado.</div>';
  } else {

  if(hostPeer){ try{ hostPeer.destroy(); }catch(e){} hostPeer = null; }
  if(clientPeer){ try{ clientPeer.destroy(); }catch(e){} clientPeer = null; }
}

function startAsHost(){

  destroyPeers();

    if(saved && saved.queue.length > 0){
      queue = saved.queue;
      curIdx = typeof saved.curIdx === "number" ? saved.curIdx : -1;
      if(curIdx >= queue.length) curIdx = -1;
      paused = !!saved.paused;

function startAsClient(){
  if(p2pInitializing) return;
  p2pInitializing = true; isHost = false;
  document.getElementById("eoverText").innerHTML = isAdmin ? "Tentando conectar ao host principal..." : "Conectando ao Host...";

  clientPeer.on("error", function(err){

    if(isHost) return;
    if(err && err.type === "peer-unavailable"){
      document.getElementById("eoverText").innerHTML = "Host ainda não iniciou. Aguardando...";
      setTimeout(function(){ if(!isHost && clientPeer && !clientPeer.destroyed) setupClient(); }, 4000);
      return;

function buildSyncState(){
  let time = 0;
  const isMp3 = curIdx >= 0 && queue[curIdx] && /\.(mp3|wav|ogg|m4a)$/i.test(queue[curIdx].videoId);
  const rawAudio = document.getElementById("rawAudio");
  if(isMp3 && rawAudio) time = rawAudio.currentTime || 0;
  else if(ytPlayer && ytPlayer.getCurrentTime){ try{ time = ytPlayer.getCurrentTime() || 0; }catch(e){} }
  return {
    type:"sync", queue:queue, curIdx:curIdx, gifUrl:currentGifUrl, glow:config.glow,
    paused:paused, time:time, simpsPoints:simpsPoints, config:config, stats:stats,
    activeUsers: clientConnections.filter(function(c){ return c.open && c.metadata; }).map(function(c){ return c.metadata.user; })
  };
}
function broadcastState(){
  if(!isHost) return;
  const payload = buildSyncState();
  clientConnections.forEach(function(c){ if(c.open){ try{ c.send(payload); }catch(e){} } });
  saveQueueState();
}
setInterval(function(){ if(isHost) broadcastState(); }, 1500);

function setupHost(){
  hostPeer.on("connection", function(conn){
    conn.on("open", function(){
      if(conn.metadata && conn.metadata.user && bannedUsers.includes(conn.metadata.user.toLowerCase())){
        try{ conn.send({ type:"banned" }); }catch(e){}
        setTimeout(function(){ try{ conn.close(); }catch(e){} }, 300);
        return;
      }
      clientConnections.push(conn);
      updateStatChips(); renderUsersModal();
      try{ conn.send(buildSyncState()); }catch(e){}
      pushEvent("sys", "SISTEMA", "👋 " + (conn.metadata && conn.metadata.user || "?") + " entrou na sala");
    });
    conn.on("data", function(data){
      if(!data) return;
      if(data.type === "cmd"){ sendCmd(data.action, data); broadcastState(); }
    });
    conn.on("close", function(){
      clientConnections = clientConnections.filter(function(c){ return c !== conn; });
      updateStatChips(); renderUsersModal();
    });
  });
}

function setupClient(){
  if(hostConnection){ try{ hostConnection.close(); }catch(e){} hostConnection = null; }
  hostConnection = clientPeer.connect(ROOM_ID, { reliable:true, metadata:{ user: myName || myTwitchName || "Viewer" } });
  hostConnection.on("open", function(){
    document.getElementById("eoverText").innerHTML = "Sincronizando com o Host...";
    toast("Conectado ao Host!", "ok");
  });
  hostConnection.on("data", function(data){
    if(!data) return;
    if(data.type === "banned"){ executeBanLoop(); return; }
    if(data.type === "syslog"){ logChat(data.user, data.text, true, data.color); pushEvent("sys", data.user, data.text); return; }
    if(data.type === "sync"){ handleSync(data); return; }
  });
  hostConnection.on("close", function(){
    clientSynced = false; hostConnection = null;
    if(!isHost){
      toast("Desconectado. Reconectando...", "err");
      setTimeout(function(){ if(!isHost) startAsClient(); }, 3000);
    }
  });
}

function handleSync(data){
  if(data.simpsPoints) simpsPoints = data.simpsPoints;
  if(data.activeUsers) syncedActiveUsers = data.activeUsers;
  if(data.stats) stats = data.stats;
  if(data.config){
    config = data.config;
    if(config.maxPerViewer === undefined) config.maxPerViewer = 5;
    initConfigUI();
  }
  const queueChanged = JSON.stringify(queue) !== JSON.stringify(data.queue);
  const idxChanged = curIdx !== data.curIdx;
  if(queueChanged || idxChanged){
    queue = data.queue || []; curIdx = data.curIdx;
    renderQueue(); renderRank();
  }
  if(data.gifUrl){ currentGifUrl = data.gifUrl; updateGifBackground(); }
  else if(!data.gifUrl && currentGifUrl){ currentGifUrl = ""; updateGifBackground(); }

  if(data.glow && curIdx !== -1) document.getElementById("playerGlow").classList.add("active");
  else document.getElementById("playerGlow").classList.remove("active");

  if(curIdx < 0 || curIdx >= queue.length){
    document.getElementById("eover").classList.remove("gone");
    document.getElementById("eoverText").innerHTML = "Aguardando Host...";
    document.getElementById("npbar").style.display = "none";
    document.getElementById("progressFill").style.width = "0%";
    clientCurrentVideoId = null;
    return;
  }
  if(!clientSynced) return;
  const item = queue[curIdx];
  document.getElementById("eover").classList.add("gone");
  document.getElementById("npbar").style.display = "flex";
  document.getElementById("npTitle").textContent = item.title;
  document.getElementById("npUser").textContent = item.user;
  document.getElementById("npUser").style.color = sanitizeColor(item.color) || "";
  updateNextLabel();

  const expectedId = item.videoId;
  const hostTime = data.time || 0;
  const now = Date.now();
  const ytFrame = document.getElementById("ytFrame");
  const rawAudio = document.getElementById("rawAudio");
  const isMp3 = /\.(mp3|wav|ogg|m4a)$/i.test(expectedId);

  if(clientCurrentVideoId !== expectedId){
    clientCurrentVideoId = expectedId; clientLastSyncTime = now;
    if(isMp3){
      if(ytReady && ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo();
      ytFrame.style.display = "none";
      if(rawAudio){
        rawAudio.style.display = "block"; rawAudio.src = expectedId;
        rawAudio.currentTime = hostTime; rawAudio.volume = config.vol / 100;
        if(data.paused) rawAudio.pause(); else rawAudio.play().catch(function(){});
      }
    } else {
      if(rawAudio){ rawAudio.pause(); rawAudio.style.display = "none"; }
      ytFrame.style.display = "block";
      if(ytReady && ytPlayer && ytPlayer.loadVideoById){
        ytPlayer.loadVideoById({ videoId:expectedId, startSeconds:hostTime });
        if(data.paused) ytPlayer.pauseVideo(); else ytPlayer.playVideo();
      }
    }
    return;
  }

  if(now - clientLastSyncTime > 5000){
    clientLastSyncTime = now;
    if(isMp3 && rawAudio){
      if(Math.abs(rawAudio.currentTime - hostTime) > SYNC_TOLERANCE_SEC) rawAudio.currentTime = hostTime;
    } else {
      try{
        const t = ytPlayer.getCurrentTime ? ytPlayer.getCurrentTime() : 0;
        if(Math.abs(t - hostTime) > SYNC_TOLERANCE_SEC) ytPlayer.seekTo(hostTime, true);
      }catch(e){}
    }
  }

  if(isMp3 && rawAudio){
    if(data.paused && !rawAudio.paused) rawAudio.pause();
    else if(!data.paused && rawAudio.paused) rawAudio.play().catch(function(){});
  } else {
    try{
      const st = ytPlayer.getPlayerState ? ytPlayer.getPlayerState() : -1;
      if(data.paused && st === 1) ytPlayer.pauseVideo();
      else if(!data.paused && st === 2) ytPlayer.playVideo();
    }catch(e){}
  }
}

/* ================= VÍDEO / FILA ================= */
async function extractId(url){
  if(!url) return null;
  const m = url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/);
  return (m && m[2].length === 11) ? m[2] : null;
}
async function fetchTitle(id){
  const apis = [
    "https://inv.nadeko.net/api/v1/videos/" + id,
    "https://invidious.nerdvpn.de/api/v1/videos/" + id,
    "https://inv.tux.pizza/api/v1/videos/" + id
  ];
  for(const api of apis){
    try{
      const r = await fetch(api);
      if(!r.ok) continue;
      const d = await r.json();
      if(d && d.title) return d.title;
    }catch(e){}
  }
  try{
    const r3 = await fetch("https://noembed.com/embed?url=https://www.youtube.com/watch?v=" + id);
    const d3 = await r3.json();
    if(d3 && d3.title) return d3.title;
  }catch(e){}
  return "Título Indisponível";
}
async function getVideoDuration(id){
  const apis = [
    "https://inv.nadeko.net/api/v1/videos/" + id,
    "https://invidious.nerdvpn.de/api/v1/videos/" + id
  ];
  for(const api of apis){
    try{
      const r = await fetch(api);
      if(!r.ok) continue;
      const d = await r.json();
      if(d && d.lengthSeconds) return d.lengthSeconds;
    }catch(e){}
  }
  return 0;
}

async function addToQueue(rawUrl, user, color, fromTwitch){
  if(!user) user = myName || "Anônimo";
  if(bannedUsers.includes(user.toLowerCase())) return;

  const id = await extractId(rawUrl);
  const isRawAudio = /\.(mp3|wav|ogg|m4a)(\?.*)?$/i.test(rawUrl);
  if(!id && !isRawAudio){
    if(fromTwitch) sendTwitchMessage("@" + user + " manda um link do YouTube: %s (link)");
    else toast("Envie um link do YouTube ou MP3", "err");
    return;
  }
  const finalId = isRawAudio ? rawUrl : id;
  if(queue.find(function(q){ return q.videoId === finalId; })){
    if(fromTwitch) sendTwitchMessage("@" + user + " esse já tá na fila!");
    else toast("Já está na fila", "err");
    return;
  }

  let title, duration = 0;
  if(isRawAudio){ title = rawUrl.split("/").pop().split("?")[0]; }
  else {
    title = await fetchTitle(id);
    if(!title || title === "Título Indisponível") title = "Vídeo " + id;
    duration = await getVideoDuration(id);
    if(duration > 0 && duration > (config.maxDuration || 5) * 60){
      if(fromTwitch) sendTwitchMessage("@" + user + " vídeo muito longo (máx " + (config.maxDuration||5) + "min)");
      else toast("Duração acima do limite", "err");
      return;
    }
  }

  const maxPer = config.maxPerViewer || 5;
  const userCount = queue.filter(function(q){ return q.user === user; }).length;
  if(userCount >= maxPer){
    if(fromTwitch) sendTwitchMessage("@" + user + " limite de " + maxPer + " vídeos na fila!");
    else toast("Máximo de " + maxPer + " vídeos na fila", "err");
    return;
  }

  if(color && color.startsWith("#")){
    twitchColors[user] = color;
    localStorage.setItem("simpTwitchColors", JSON.stringify(twitchColors));
  }
  if(fromTwitch && !twitchUsers.has(user)){
    twitchUsers.add(user);
    localStorage.setItem("simpTwitchUsers", JSON.stringify(Array.from(twitchUsers)));
  }

  const thumb = isRawAudio
    ? "https://i.giphy.com/blSTtZehjAZ8I.webp"
    : "https://img.youtube.com/vi/" + id + "/hqdefault.jpg";

  queue.push({ videoId:finalId, title:title, user:user, color:twitchColors[user] || null, thumb:thumb });
  if(isHost) addPoints(user, 2);
  logChat(user, "🎵 " + title, true, twitchColors[user] || "#ff2e88");
  pushEvent("add", user, "adicionou \"" + title + "\"");
  if(isHost) playPing();
  if(!fromTwitch) toast("Adicionado à fila", "ok");
  if(fromTwitch) sendTwitchMessage("@" + user + " adicionou \"" + title + "\" na posição " + queue.length + " (+2 Simps)");
  if(config.fx !== false) confettiBurst(18);

  if(isHost && curIdx === -1) startPlayback(0);
  else renderQueue();
  if(isHost){ saveQueueState(); broadcastState(); }
}

function startPlayback(idx, startAtTime){
  if(!isHost || idx < 0 || idx >= queue.length) return;
  stopEmptySound();
  curIdx = idx;
  const item = queue[curIdx];
  const st = typeof startAtTime === "number" ? startAtTime : 0;
  document.getElementById("eover").classList.add("gone");
  document.getElementById("npbar").style.display = "flex";
  document.getElementById("npTitle").textContent = item.title;
  document.getElementById("npUser").textContent = item.user;
  document.getElementById("npUser").style.color = sanitizeColor(item.color) || "";
  document.getElementById("playerGlow").style.backgroundImage = "url(" + item.thumb + ")";
  if(config.glow) document.getElementById("playerGlow").classList.add("active");
  updateNextLabel();
  loadVid(item.videoId, st);

  if(/\.(mp3|wav|ogg|m4a)$/i.test(item.videoId)){
    currentGifUrl = "https://media.giphy.com/media/r50i0lZV4ijvzLcJKz/giphy.gif";
    updateGifBackground();
  } else setQueueGif(item.title);

  renderQueue(); saveQueueState();
}

  if(queue[nextIdx]){
    el.innerHTML = "próxima ▸ <b>" + esc(queue[nextIdx].title) + "</b>";

  const ytFrame = document.getElementById("ytFrame");
  const rawAudio = document.getElementById("rawAudio");
  const isMp3 = /\.(mp3|wav|ogg|m4a)$/i.test(id);
  const st = typeof startTime === "number" ? startTime : 0;
  if(isMp3){
    if(ytReady && ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo();
    ytFrame.style.display = "none";
    if(rawAudio){
      rawAudio.style.display = "block"; rawAudio.src = id; rawAudio.volume = config.vol / 100;
      if(st > 0){
        rawAudio.onloadedmetadata = function(){
          try{ rawAudio.currentTime = st; }catch(e){}
          rawAudio.onloadedmetadata = null;
        };
      }
      if(!paused) rawAudio.play().catch(function(){});
    }
  } else {
    if(rawAudio){ rawAudio.pause(); rawAudio.style.display = "none"; }
    ytFrame.style.display = "block";
    if(ytReady && ytPlayer && ytPlayer.loadVideoById){
      ytPlayer.loadVideoById({ videoId:id, startSeconds:st });
      if(!paused) ytPlayer.playVideo();
    }
  }
}

/* ================= RENDER FILA ================= */
function renderQueue(){
  const list = document.getElementById("qlist");
  const empty = document.getElementById("qempty");
  document.getElementById("qcount").textContent = queue.length;
  list.querySelectorAll(".qi").forEach(function(i){ i.remove(); });
  if(queue.length === 0){ empty.style.display = "flex"; return; }
  empty.style.display = "none";
  queue.forEach(function(item, i){
    const isCur = i === curIdx;
    const pos = isCur ? "▶" : (curIdx >= 0 ? "#" + (i - curIdx) : "#" + (i + 1));
    const d = document.createElement("div");
    d.className = "qi" + (isCur ? " cur" : "");
    d.innerHTML =
      '<div class="qithumb"><img src="' + esc(item.thumb) + '" loading="lazy"></div>' +
      '<div class="qibody"><div class="qititle" title="' + esc(item.title) + '">' + esc(item.title) + '</div>' +
      '<div class="qiuser" style="' + (item.color ? "color:" + sanitizeColor(item.color) : "") + '">' + esc(item.user) + '</div></div>' +
      (!isCur ? '<span class="qinum">' + pos + '</span>' : '') +
      '<button class="qisave" data-i="' + i + '" title="Salvar na playlist">💾</button>' +
      ((isAdmin || (item.user === myName && !isCur)) && !isCur ? '<button class="qidel" data-i="' + i + '" title="Remover">✕</button>' : '');
    if(isHost && !isCur){
      d.draggable = true;
      d.addEventListener("dragstart", function(){ dragIdx = i; d.classList.add("dragging"); });
      d.addEventListener("dragend", function(){ d.classList.remove("dragging"); dragIdx = -1; });
      d.addEventListener("dragover", function(e){ e.preventDefault(); });
      d.addEventListener("drop", function(e){
        e.preventDefault();
        if(dragIdx < 0 || dragIdx === i) return;
        const moved = queue.splice(dragIdx, 1)[0];
        queue.splice(i, 0, moved);
        if(dragIdx < curIdx && i >= curIdx) curIdx--;
        else if(dragIdx > curIdx && i <= curIdx) curIdx++;
        dragIdx = -1;
        renderQueue(); saveQueueState(); broadcastState();
        toast("Fila reordenada", "ok");
      });
    }
    list.appendChild(d);
  });
  list.querySelectorAll(".qisave").forEach(function(btn){
    btn.addEventListener("click", function(e){
      e.stopPropagation();
      const item = queue[parseInt(btn.dataset.i)];
      if(!simpPlaylist.find(function(v){ return v.videoId === item.videoId; })){
        simpPlaylist.push(item);
        localStorage.setItem("simpPlaylist", JSON.stringify(simpPlaylist));
        renderPlaylist(); toast("Salvo na playlist!", "ok");
      }
    });
  });
  list.querySelectorAll(".qidel").forEach(function(btn){
    btn.addEventListener("click", function(e){
      e.stopPropagation();
      const i = parseInt(btn.dataset.i);
      queue.splice(i, 1);
      if(i < curIdx) curIdx--;
      else if(i === curIdx){
        curIdx = -1;
        if(queue.length > 0) startPlayback(0); else showEmpty();
      }
      renderQueue();
      if(isHost){ saveQueueState(); broadcastState(); }
    });
  });
  updateNextLabel();
}

/* ================= TWITCH BOT ================= */
function sendTwitchMessage(msg){
  const now = Date.now();
  if(now - lastTwitchMessageTime < TWITCH_COOLDOWN_MS) return;
  lastTwitchMessageTime = now;
  if(twitchWs && twitchWs.readyState === WebSocket.OPEN){
    twitchWs.send("PRIVMSG #" + CHANNEL + " :" + msg);
    logChat("BOT", msg, true, "#ffd166");
  }
}

function sendCmd(action, payload){
  payload = payload || {};
  if(isHost){
    if(action === "add") addToQueue(payload.url, payload.user, payload.color, payload.fromTwitch);
    if(action === "ban" && payload.target) banUser(payload.target);
    if(action === "unban" && payload.target) unbanUser(payload.target);
    if(action === "skip"){ pushEvent("sys", "SISTEMA", "⏭ vídeo pulado por " + (payload.user || myName)); nextVideo(); }
    if(action === "shuffle"){
      queue = queue.sort(function(){ return Math.random() - 0.5; });
      curIdx = queue.findIndex(function(q){ return false; });
      renderQueue(); saveQueueState();
      pushEvent("sys", "SISTEMA", "🔀 fila embaralhada por " + (payload.user || myName));
    }
    if(action === "replay"){
      if(curIdx >= 0 && queue[curIdx]){ startPlayback(curIdx, 0); pushEvent("sys", "SISTEMA", "🔁 replay"); }
    }
    if(action === "pause"){
      paused = !paused;
      const isMp3 = curIdx >= 0 && /\.(mp3|wav|ogg|m4a)$/i.test(queue[curIdx].videoId);
      const rawAudio = document.getElementById("rawAudio");
      if(isMp3 && rawAudio){ if(paused) rawAudio.pause(); else rawAudio.play().catch(function(){}); }
      else { if(paused && ytPlayer) ytPlayer.pauseVideo(); else if(ytPlayer) ytPlayer.playVideo(); }
      pushEvent("sys", "SISTEMA", (paused ? "⏸ pausado" : "▶ despausado") + " por " + (payload.user || myName));
      saveQueueState();
    }
    if(action === "clear"){ queue = []; showEmpty(); pushEvent("sys", "SISTEMA", "🗑 fila limpa por " + (payload.user || myName)); }
    if(action === "seek" && payload.time !== undefined){
      const isMp3 = curIdx >= 0 && /\.(mp3|wav|ogg|m4a)$/i.test(queue[curIdx].videoId);
      const rawAudio = document.getElementById("rawAudio");
      if(isMp3 && rawAudio) rawAudio.currentTime = payload.time;
      else if(ytPlayer) ytPlayer.seekTo(payload.time, true);
    }
    if(action === "twitch") handleTwitchCommand(payload);
    broadcastState();
  } else if(hostConnection && hostConnection.open){
    hostConnection.send(Object.assign({ type:"cmd", action:action }, payload));
    if(action !== "seek") toast("Enviado ao Host", "ok");
  }
}

/* ===== comandos vindos do chat (só o host executa, evita spam de bot) ===== */
function handleTwitchCommand(p){
  const user = p.user, arg = p.arg || "", isMod = !!p.isMod;
  const color = p.color || "#ff2e88";
  const parts = arg.split(/\s+/).filter(Boolean);
  const action = (parts[0] || "").toLowerCase();
  const rest = parts.slice(1).join(" ");

  function modOrPaid(cost){
    if(isMod || isHost) return true;
    if(getUserPoints(user) >= cost) { spendPoints(user, cost); return true; }
    return false;
  }

  switch(action){
    case "ajuda": case "help":
      sendTwitchMessage("@" + user + " comandos: daily | roleta (qtd) | duelo (qtd) @user | pontos | rank | skip | trocar | gif | atual | proxima | lista | play | pause | give | ban | unban | site | remover | (link)");
      break;
    case "daily": {
      if(dailyClaims[user] === todayStr()){ sendTwitchMessage("@" + user + " você já resgatou hoje! Volte amanhã 🌙"); break; }
      dailyClaims[user] = todayStr(); saveDaily();
      addPoints(user, 50);
      sendTwitchMessage("@" + user + " resgatou 50 Simps diários! 💰 (total: " + getUserPoints(user) + ")");
      break;
    }
    case "roleta": {
      const amt = parseInt(parts[1], 10);
      if(isNaN(amt) || amt <= 0){ sendTwitchMessage("@" + user + " uso: %s roleta (quantia)"); break; }
      if(getUserPoints(user) < amt){ sendTwitchMessage("@" + user + " Simps insuficientes besta"); break; }
      spendPoints(user, amt);
      const roll = Math.random();
      if(roll < 0.05){
        addPoints(user, amt * 5);
        sendTwitchMessage("🎰 @" + user + " JACKPOT x5!!! +" + (amt*5) + " Simps! PogChamp");
        if(config.fx !== false) confettiBurst(50);
      } else if(roll < 0.50){
        addPoints(user, amt * 2);
        sendTwitchMessage("🎰 @" + user + " ganhou! +" + (amt*2) + " Simps");
      } else {
        sendTwitchMessage("🎰 @" + user + " perdeu " + amt + " Simps... EZ");
      }
      break;
    }
    case "duelo": {
      const amt = parseInt(parts[1], 10);
      const target = (parts[parts.length-1] || "").replace("@","").toLowerCase();
      if(isNaN(amt) || amt <= 0 || !target || target === user){ sendTwitchMessage("@" + user + " uso: %s duelo (quantia) @usuario"); break; }
      if(getUserPoints(user) < amt){ sendTwitchMessage("@" + user + " pobre demais pra apostar isso"); break; }
      if(getUserPoints(target) < amt){ sendTwitchMessage("@" + user + " @" + target + " não tem Simps pra cobrir o duelo"); break; }
      spendPoints(user, amt); spendPoints(target, amt);
      const winner = Math.random() < 0.5 ? user : target;
      const loser = winner === user ? target : user;
      addPoints(winner, amt * 2);
      sendTwitchMessage("⚔️ @" + user + " desafiou @" + target + " valendo " + amt + " → @" + winner + " VENCEU e fica com tudo! @" + loser + " L");
      if(config.fx !== false) emoteBurst(["⚔️","💀","🏆"]);
      break;
    }
    case "give": {
      const amt = parseInt(parts[1], 10);
      const target = (parts[parts.length-1] || "").replace("@","").toLowerCase();
      if(isNaN(amt) || amt <= 0 || !target){ sendTwitchMessage("@" + user + " uso: %s give (qtd) @usuario"); break; }
      if(target === user){ sendTwitchMessage("@" + user + " não pode dar a si mesmo besta"); break; }
      if(!spendPoints(user, amt)){ sendTwitchMessage("@" + user + " Simps insuficientes"); break; }
      addPoints(target, amt);
      sendTwitchMessage("💸 @" + user + " deu " + amt + " Simps para @" + target);
      break;
    }
    case "pontos": {
      const target = rest ? rest.replace("@","").toLowerCase() : user;
      sendTwitchMessage("💜 @" + user + " → " + target + " tem " + getUserPoints(target) + " Simps");
      break;
    }
    case "ban": {
      if(isMod || isHost){ banUser(rest.replace("@","").toLowerCase()); sendTwitchMessage("🔨 @" + user + " baniu @" + rest.replace("@","").toLowerCase()); }
      else sendTwitchMessage("@" + user + " seja mod primeiro besta");
      break;
    }
    case "unban": {
      if(isMod || isHost){ unbanUser(rest.replace("@","").toLowerCase()); sendTwitchMessage("✅ @" + user + " desbaniu @" + rest.replace("@","").toLowerCase()); }
      else sendTwitchMessage("@" + user + " seja mod primeiro besta");
      break;
    }
    case "skip": {
      if(modOrPaid(25)){ nextVideo(); sendTwitchMessage("⏭ @" + user + " pulou o vídeo"); }
      else sendTwitchMessage("@" + user + " skip custa 25 Simps, grátis p/ mods");
      break;
    }
    case "trocar": {
      if(modOrPaid(25)){
        queue = queue.sort(function(){ return Math.random() - 0.5; });
        renderQueue(); saveQueueState();
        sendTwitchMessage("🔀 @" + user + " embaralhou a fila");
      } else sendTwitchMessage("@" + user + " custa 25 Simps, grátis p/ mods");
      break;
    }
    case "gif": {
      if(!rest){ sendTwitchMessage("@" + user + " uso: %s gif (nome)"); break; }
      if(modOrPaid(10)){ setQueueGif(rest); sendTwitchMessage("🖼 @" + user + " trocou o fundo para: " + rest); }
      else sendTwitchMessage("@" + user + " custa 10 Simps, grátis p/ mods");
      break;
    }
    case "atual": {
      if(curIdx >= 0 && queue[curIdx]){
        const it = queue[curIdx];
        sendTwitchMessage("🎵 tocando: \"" + it.title + "\" pedido por " + it.user);
      } else sendTwitchMessage("@" + user + " nada tocando agora");
      break;
    }
    case "proxima": {
      const n = queue[curIdx + 1];
      if(n) sendTwitchMessage("⏭ próxima: \"" + n.title + "\" pedido por " + n.user);
      else sendTwitchMessage("@" + user + " não tem próxima música");
      break;
    }
    case "lista": {
      if(!queue.length){ sendTwitchMessage("@" + user + " fila vazia. Manda %s (link)!"); break; }
      const n = queue[curIdx + 1] || queue[0];
      sendTwitchMessage("📼 " + queue.length + " na fila. Próxima: \"" + n.title + "\" de " + n.user);
      break;
    }
    case "rank": case "top": {
      const top = Object.entries(simpsPoints).sort(function(a,b){ return b[1]-a[1]; }).slice(0, 10);
      if(!top.length){ sendTwitchMessage("@" + user + " ninguém tem Simps ainda"); break; }
      let s = top.map(function(it, i){ return (i+1) + "." + it[0] + "(" + it[1] + ")"; }).join(" | ");
      if(s.length > 380) s = s.slice(0, 377) + "...";
      sendTwitchMessage("🏆 Top: " + s);
      break;
    }
    case "play": {
      if(isMod || isHost){ if(paused) sendCmd("pause", { user:user }); sendTwitchMessage("▶ @" + user + " deu play"); }
      else sendTwitchMessage("@" + user + " seja mod primeiro besta");
      break;
    }
    case "pause": {
      if(isMod || isHost){ if(!paused) sendCmd("pause", { user:user }); sendTwitchMessage("⏸ @" + user + " pausou"); }
      else sendTwitchMessage("@" + user + " seja mod primeiro besta");
      break;
    }
    case "site": {
      sendTwitchMessage("🌐 sala: " + SITE_URL);
      break;
    }
    case "remover": {
      let idx = -1;
      for(let i = queue.length - 1; i >= 0; i--){ if(queue[i].user === user){ idx = i; break; } }
      if(idx === -1){ sendTwitchMessage("@" + user + " você não tem vídeos na fila"); break; }
      if(idx === curIdx){ sendTwitchMessage("@" + user + " não pode remover o que tá tocando"); break; }
      queue.splice(idx, 1);
      if(idx < curIdx) curIdx--;
      renderQueue(); saveQueueState();
      sendTwitchMessage("🗑 @" + user + " removeu o pedido dele da fila");
      break;
    }
    default: {
      if(arg) addToQueue(arg, user, color, true);
      break;
    }
  }
  renderRank();
}

/* ================= WEBSOCKET TWITCH ================= */
function connectTwitch(){
  if(twitchWs && twitchWs.readyState === WebSocket.OPEN) return;
  if(twitchWs && twitchWs.readyState === WebSocket.CONNECTING) return;
  twitchWs = new WebSocket("wss://irc-ws.chat.twitch.tv:443");

  twitchWs.onopen = function(){
    try{
      twitchWs.send("PASS " + BOT_OAUTH);
      twitchWs.send("NICK " + BOT_NICK);
      twitchWs.send("JOIN #" + CHANNEL);
      twitchWs.send("CAP REQ :twitch.tv/tags");
      twitchWs.send("CAP REQ :twitch.tv/commands");
      pushEvent("sys", "SISTEMA", "🔗 conectado ao chat da Twitch");
    }catch(e){}
  };
  twitchWs.onerror = function(){ twitchWs = null; };
  twitchWs.onmessage = async function(e){
    const messages = e.data.trim().split("\r\n");
    for(let raw of messages){
      raw = raw.trim(); if(!raw) continue;
      if(raw.startsWith("PING")){ twitchWs.send("PONG :tmi.twitch.tv"); continue; }
      if(raw.includes("RECONNECT")){ try{ twitchWs.close(); }catch(e){} continue; }
      if(raw.includes("Login authentication failed")){ pushEvent("sys", "SISTEMA", "❌ OAuth do bot inválido"); continue; }

      let tags = {}; let messagePart = raw;
      if(raw.startsWith("@")){
        const tagEnd = raw.indexOf(" :");
        if(tagEnd !== -1){
          raw.substring(1, tagEnd).split(";").forEach(function(t){
            const p = t.split("="); tags[p[0]] = p[1] || "";
          });
          messagePart = raw.substring(tagEnd + 1);
        }
      }
      const m = messagePart.match(/:([\w]+)![\w]+@[\w]+\.tmi\.twitch\.tv PRIVMSG #[\w]+ :(.*)/);
      if(!m) continue;

      const twitchUser = m[1].toLowerCase();
      const msg = m[2].trim();
      const rawColor = tags.color && tags.color.startsWith("#") ? tags.color : null;
      const color = rawColor || "#ff2e88";
      const isMod = tags.mod === "1" || (tags.badges && tags.badges.includes("moderator"));

      if(isMod) twitchMods.add(twitchUser);
      if(!myTwitchName) myTwitchName = twitchUser;
      if(rawColor){ twitchColors[twitchUser] = rawColor; localStorage.setItem("simpTwitchColors", JSON.stringify(twitchColors)); }
      if(!twitchUsers.has(twitchUser)){
        twitchUsers.add(twitchUser);
        localStorage.setItem("simpTwitchUsers", JSON.stringify(Array.from(twitchUsers)));
      }

      const low = msg.toLowerCase();
      let payload = null;
      if(low.startsWith("%s")) payload = msg.slice(2).trim();
      else if(low.startsWith("%simp")) payload = msg.slice(5).trim();

      if(payload !== null){
        // host executa; clientes apenas repassam (evita resposta duplicada do bot)
        if(isHost){
          handleTwitchCommand({ user:twitchUser, arg:payload, color:color, isMod:isMod });
        } else if(hostConnection && hostConnection.open){
          hostConnection.send({ type:"cmd", action:"twitch", user:twitchUser, arg:payload, color:color, isMod:isMod });
        }
      } else {
        logChat(twitchUser, msg, false, color, isMod);
        if(config.fx !== false) checkEmoteTriggers(msg);
      }
    }
  };
  twitchWs.onclose = function(ev){
    pushEvent("sys", "SISTEMA", "🔴 chat desconectado (" + ev.code + "), reconectando...");
    twitchWs = null;
    setTimeout(connectTwitch, 5000);
  };
}

/* ================= EMOTES / CONFETE ================= */
const EMOTE_MAP = [
  { re:/\bpog\b|pogchamp/i, emotes:["😱","🔥","🎉","🤯"] },
  { re:/\bkekw\b|\blol\b|\blmao\b|kkkk|rsrs|haha/i, emotes:["😂","🤣","💀"] },
  { re:/\bsus\b|amongus/i, emotes:["🚨","👀","❓"] },
  { re:/\bbombando\b|\bbrabo\b|insano|monstr/i, emotes:["🚀","🔥","💪"] },
  { re:/🦜|parrot/i, emotes:["🦜","🦜","🦜"] },
  { re:/\?\?\?\?\?+/i, emotes:["❓","❗","🤔"] }
];
function checkEmoteTriggers(msg){
  for(const t of EMOTE_MAP){
    if(t.re.test(msg)){ emoteBurst(t.emotes); return; }
  }
}
function emoteBurst(emotes){
  const n = 6 + Math.floor(Math.random() * 6);
  for(let i = 0; i < n; i++){
    const el = document.createElement("div");
    el.className = "fx-emote";
    el.textContent = emotes[Math.floor(Math.random() * emotes.length)];
    el.style.left = (5 + Math.random() * 85) + "vw";
    el.style.top = (20 + Math.random() * 50) + "vh";
    el.style.animation = "fxEmotePop " + (1 + Math.random() * 0.8) + "s ease forwards";
    el.style.animationDelay = (Math.random() * 0.5) + "s";
    document.body.appendChild(el);
    setTimeout(function(){ el.remove(); }, 2500);
  }
}
function confettiBurst(count){
  const colors = ["#ff2e88","#00e5ff","#ffd166","#7b2eff","#5de89a","#ffffff"];
  for(let i = 0; i < count; i++){
    const el = document.createElement("div");
    el.className = "fx-piece";
    const w = 5 + Math.random() * 7;
    el.style.width = w + "px"; el.style.height = (w + 4 + Math.random() * 6) + "px";
    el.style.left = Math.random() * 100 + "vw";
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.borderRadius = Math.random() > 0.5 ? "50%" : "2px";
    const dur = 1.6 + Math.random() * 1.6;
    el.style.animation = "fxFall " + dur + "s linear forwards";
    el.style.animationDelay = (Math.random() * 0.4) + "s";
    document.body.appendChild(el);
    setTimeout(function(){ el.remove(); }, (dur + 0.5) * 1000);
  }
}

/* ================= CHAT TICKER ================= */
var logQueue = [], logBusy = false;
function logChat(user, text, isCmd, color, isMod){
  logQueue.push({ user:user, text:text, color:color, isMod:!!isMod, points:getUserPoints(user) });
  processLogQueue();
}
function processLogQueue(){
  if(logBusy || !logQueue.length) return;
  var inner = document.getElementById("logInner"); if(!inner) return;
  logBusy = true;
  var item = logQueue.shift();
  var d = document.createElement("div"); d.className = "cm";
  d.innerHTML = '<span class="cmu" style="color:' + sanitizeColor(item.color) + '">' + esc(item.user) +
    (item.isMod ? ' <span style="color:#ffd166">[MOD]</span>' : "") +
    ' <span style="color:#7a7a92">(' + (item.points || 0) + '💜)</span></span>: <span class="cmt">' + esc(item.text) + "</span>";
  inner.appendChild(d);
  requestAnimationFrame(function(){
    var boxW = inner.clientWidth || 300;
    var msgW = d.offsetWidth || 120;
    var startX = -msgW, endX = boxW + 8;
    var dur = Math.min(11, Math.max(4, (endX - startX) / 55));
    d.style.transform = "translateY(-50%) translateX(" + startX + "px)";
    d.style.opacity = "0";
    void d.offsetWidth;
    d.style.transition = "transform " + dur + "s linear, opacity .3s ease";
    d.style.transform = "translateY(-50%) translateX(" + endX + "px)";
    d.style.opacity = "1";
    var releaseAt = Math.max(1.2, dur * 0.55) * 1000;
    setTimeout(function(){ logBusy = false; processLogQueue(); }, releaseAt);
    setTimeout(function(){ d.style.opacity = "0"; }, (dur - 0.35) * 1000);
    setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); }, (dur + 0.25) * 1000);
  });
}

const seekClient = document.getElementById("seekSliderClient");
const volClient = document.getElementById("volSliderClient");
["mousedown","touchstart","pointerdown"].forEach(function(ev){ seekClient.addEventListener(ev, function(){ draggingSeek = true; }); });
["mouseup","touchend","pointerup"].forEach(function(ev){ seekClient.addEventListener(ev, function(){ draggingSeek = false; }); });

volClient.addEventListener("input", function(){
  config.vol = parseInt(this.value);
  document.getElementById("volNumClient").textContent = config.vol + "%";
  if(ytPlayer && ytPlayer.setVolume) ytPlayer.setVolume(config.vol);
  const rawAudio = document.getElementById("rawAudio");
  if(rawAudio) rawAudio.volume = config.vol / 100;
  saveConfig();
  if(isHost) broadcastState();
});
seekClient.addEventListener("input", function(){
  if(isHost){
    const isMp3 = curIdx >= 0 && /\.(mp3|wav|ogg|m4a)$/i.test(queue[curIdx].videoId);
    const rawAudio = document.getElementById("rawAudio");
    if(isMp3 && rawAudio) rawAudio.currentTime = parseFloat(this.value);
    else if(ytPlayer && ytPlayer.seekTo) ytPlayer.seekTo(parseFloat(this.value), true);
  } else if(isAdmin && hostConnection && hostConnection.open){
    hostConnection.send({ type:"cmd", action:"seek", time:parseFloat(this.value), user:myName });
  }
});
document.getElementById("progressBar").addEventListener("click", function(e){
  const dur = parseFloat(seekClient.max) || 0;
  if(!dur) return;
  const rect = this.getBoundingClientRect();
  const ratio = (e.clientX - rect.left) / rect.width;
  const t = ratio * dur;
  if(isHost){
    const isMp3 = curIdx >= 0 && /\.(mp3|wav|ogg|m4a)$/i.test(queue[curIdx].videoId);
    const rawAudio = document.getElementById("rawAudio");
    if(isMp3 && rawAudio) rawAudio.currentTime = t;
    else if(ytPlayer) ytPlayer.seekTo(t, true);
  } else if(isAdmin && hostConnection && hostConnection.open){
    hostConnection.send({ type:"cmd", action:"seek", time:t, user:myName });
  }
});

setInterval(function(){
  let cur = 0, dur = 0;
  const rawAudio = document.getElementById("rawAudio");
  const isMp3 = curIdx >= 0 && queue[curIdx] && /\.(mp3|wav|ogg|m4a)$/i.test(queue[curIdx].videoId);
  if(curIdx >= 0 && queue[curIdx]){
    if(isMp3 && rawAudio){
      cur = rawAudio.currentTime || 0;
      dur = isFinite(rawAudio.duration) ? rawAudio.duration : 0;
    } else if(ytReady && ytPlayer && ytPlayer.getCurrentTime){
      try{ cur = ytPlayer.getCurrentTime() || 0; dur = ytPlayer.getDuration ? ytPlayer.getDuration() || 0 : 0; }catch(e){}
    }
  }
  if(!draggingSeek){ seekClient.max = dur || 100; seekClient.value = cur; }
  document.getElementById("seekTimeClient").textContent = fmtTime(cur) + "/" + (dur > 0 ? fmtTime(dur) : "--:--");
  document.getElementById("progressFill").style.width = (dur > 0 ? (cur / dur) * 100 : 0) + "%";
}, 500);

/* ================= EASTER EGGS (novos!) ================= */
(function(){
  const logoEl = document.getElementById("logoEl");
  let eggActive = false, lastEggKey = null;

  function eggToast(msg){
    const t = document.createElement("div");
    t.className = "egg-toast"; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function(){ if(t.parentNode) t.remove(); }, 3300);
  }

  /* 1 TIME FREEZE */
  function eggFreeze(done){
    eggToast("⏱ TIME FREEZE!");
    const vig = document.createElement("div");
    vig.className = "egg-freeze-vig";
    document.body.appendChild(vig);
    requestAnimationFrame(function(){ vig.classList.add("on"); });
    document.body.classList.add("egg-freeze");
    setTimeout(function(){
      document.body.classList.remove("egg-freeze");
      vig.classList.remove("on");
      setTimeout(function(){ vig.remove(); }, 500);
      done();
    }, 3600);
  }

  /* 2 CHUVA DIGITAL */
  function eggRain(done){
    eggToast("🌧 A MATRIX TE OBSERVA...");
    const canvas = document.createElement("canvas");
    canvas.className = "egg-canvas";
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    document.body.appendChild(canvas);
    const ctx = canvas.getContext("2d");
    const chars = "SIMP+01▓▒░$#@%&Ξ♪♫";
    const fs = 16;
    const cols = Math.floor(canvas.width / fs);
    const drops = new Array(cols).fill(1);
    const interval = setInterval(function(){
      ctx.fillStyle = "rgba(7,7,13,.16)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#00e5ff";
      ctx.font = fs + "px monospace";
      for(let i = 0; i < drops.length; i++){
        ctx.fillText(chars[Math.floor(Math.random() * chars.length)], i * fs, drops[i] * fs);
        if(drops[i] * fs > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    }, 45);
    setTimeout(function(){
      clearInterval(interval);
      canvas.style.transition = "opacity .6s"; canvas.style.opacity = "0";
      setTimeout(function(){ canvas.remove(); done(); }, 600);
    }, 4200);
  }

  /* 3 RAVE */
  function eggRave(done){
    eggToast("🪩 RAVE DO SIMP+ 🪩");
    document.body.classList.add("egg-rave");
    const overlay = document.createElement("div");
    overlay.className = "egg-rave-overlay";
    document.body.appendChild(overlay);
    if(logoEl) logoEl.classList.add("egg-rave-spin");
    if(config.fx !== false) confettiBurst(40);
    setTimeout(function(){
      document.body.classList.remove("egg-rave");
      if(logoEl) logoEl.classList.remove("egg-rave-spin");
      overlay.remove();
      done();
    }, 4000);
  }

  /* 4 GRAVIDADE ZERO */
  function eggZero(done){
    eggToast("🛸 gravidade desligada");
    document.body.classList.add("egg-zero");
    setTimeout(function(){ document.body.classList.remove("egg-zero"); done(); }, 4000);
  }

  /* 5 TV QUEBRADA */
  function eggTv(done){
    eggToast("📺 SINAL PERDIDO...");
    document.body.classList.add("egg-tv");
    const overlay = document.createElement("div");
    overlay.className = "egg-tv-overlay";
    document.body.appendChild(overlay);
    setTimeout(function(){
      document.body.classList.remove("egg-tv");
      overlay.remove();
      done();
    }, 2600);
  }

  /* 6 INVASÃO DE POMBOS */
  function eggPombos(done){
    eggToast("🕊️ ELES CHEGARAM 🕊️");
    const n = 12;
    for(let i = 0; i < n; i++){
      setTimeout(function(){
        const p = document.createElement("div");
        p.className = "fx-pombo";
        p.textContent = "🕊️";
        p.style.top = (5 + Math.random() * 80) + "vh";
        p.style.fontSize = (1.6 + Math.random() * 2) + "rem";
        const dur = 2 + Math.random() * 2;
        p.style.animation = "fxPomboFly " + dur + "s linear forwards";
        document.body.appendChild(p);
        setTimeout(function(){ p.remove(); }, dur * 1000 + 100);
      }, i * 160);
    }
    setTimeout(done, n * 160 + 2200);
  }

  /* 7 BIG HEAD */
  function eggBigHead(done){
    eggToast("🗿 BIG HEAD MODE");
    if(logoEl){
      logoEl.classList.add("egg-bighead");
      setTimeout(function(){ logoEl.classList.remove("egg-bighead"); done(); }, 2900);
    } else done();
  }

  /* 8 TERREMOTO */
  function eggQuake(done){
    eggToast("🌋 TERREMOTO!");
    document.body.classList.add("egg-quake");
    if(config.fx !== false) emoteBurst(["😱","🫨","🏃","💨"]);
    setTimeout(function(){ document.body.classList.remove("egg-quake"); done(); }, 2900);
  }

  const eggs = [
    { key:"freeze", run:eggFreeze },
    { key:"rain", run:eggRain },
    { key:"rave", run:eggRave },
    { key:"zero", run:eggZero },
    { key:"tv", run:eggTv },
    { key:"pombos", run:eggPombos },
    { key:"bighead", run:eggBigHead },
    { key:"quake", run:eggQuake }
  ];
  function pickEgg(){
    let choice;
    do { choice = eggs[Math.floor(Math.random() * eggs.length)]; }
    while(eggs.length > 1 && choice.key === lastEggKey);
    lastEggKey = choice.key;
    return choice;
  }
  if(logoEl){
    logoEl.addEventListener("click", function(){
      logoClicks++;
      if(logoClicks % 10 === 0) toast("👀 a logo guarda segredos...", "ok");
      if(eggActive) return;
      eggActive = true;
      pickEgg().run(function(){ eggActive = false; });
    });
  }
})();
