<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simp. P2P</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
/* CSS mantido e expandido */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0f;--surface:#12121a;--surface2:#1a1a26;--border:rgba(255,255,255,0.07);--accent:#ff3c6e;--text:#f0f0f5;--muted:#6b6b80;--hh:58px;}
body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;overflow-x:hidden}
header{height:var(--hh);display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:200;background:rgba(10,10,15,.95)}
.logo{font-size:1.5rem;font-weight:800;letter-spacing:-.02em; display:flex; align-items:center; gap:10px;}
.logo span{color:var(--accent)}
.role-badge{font-size:0.6rem; padding:0.2rem 0.5rem; border-radius:10px; font-family:'Space Mono'; text-transform:uppercase; font-weight:bold; letter-spacing:1px; background:#333;}
.role-host{background:rgba(145,71,255,.2); color:#bf94ff; border:1px solid #bf94ff;}
.role-client{background:rgba(50,200,100,.2); color:#5de89a; border:1px solid #5de89a;}
.hright{display:flex;align-items:center;gap:.75rem}
.abtn{background:none;border:1px solid var(--border);color:var(--muted);padding:.3rem .85rem;border-radius:20px;font-family:'Space Mono',monospace;font-size:.7rem;cursor:pointer;transition:.2s}
.abtn:hover{border-color:var(--accent);color:var(--accent)}
.tp{display:flex;align-items:center;gap:.4rem;background:rgba(145,71,255,.12);border:1px solid rgba(145,71,255,.3);border-radius:20px;padding:.28rem .75rem;font-family:'Space Mono',monospace;font-size:.7rem;color:#bf94ff; cursor: pointer;}
.tdot{width:6px;height:6px;border-radius:50%;background:#bf94ff;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:999}
.ovl.open{display:flex}
.modal{background:var(--surface);border:1px solid rgba(255,60,110,.25);border-radius:14px;padding:1.5rem;width:350px; text-align:center;}
.user-list-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid var(--border); font-family: 'Space Mono'; font-size: 0.75rem; }
.btn-ban { background: #ff3c6e; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.6rem; }
.btn-unban { background: #5de89a; color: black; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.6rem; }
</style>
</head>
<body>

<div class="ovl open" id="twitchLoginOvl" style="background:#0a0a0f; z-index:99999;">
  <div class="modal">
    <h2 style="color:#bf94ff; font-size:1.8rem; margin-bottom:10px;">Simp. P2P</h2>
    <p>Conectando...</p>
    <button id="twitchLoginBtn" style="background:#9146FF; border:none; padding:1rem; border-radius:8px; color:white; font-weight:bold; cursor:pointer;">Entrar com a Twitch</button>
  </div>
</div>

<div class="ovl" id="usersModal">
    <div class="modal">
        <h2 style="margin-bottom:10px; font-size: 1.2rem;">Usuários Conectados</h2>
        <div id="usersListContent" style="text-align:left; margin-bottom: 1rem;"></div>
        <button class="abtn" onclick="document.getElementById('usersModal').classList.remove('open')">Fechar</button>
    </div>
</div>

<header>
  <div class="logo">Simp<span>.</span> <span id="roleBadge" class="role-badge">...</span></div>
  <div class="hright">
    <div class="tp" id="clientsBadge" style="display:none;background:rgba(50,200,100,.1);border-color:rgba(50,200,100,.3);color:#5de89a" onclick="openUsersModal()">
        <span id="clientsCount">0</span> 👥
    </div>
    <button class="abtn" id="logoutBtn">Sair</button>
  </div>
</header>
<main>
    <div style="padding: 2rem; color: var(--muted); font-family: 'Space Mono'; text-align: center;">Sistema P2P Online</div>
</main>

<script>
const TWITCH_CLIENT_ID = 'lawe3wmm3jifj7vok0xmixm33pzh72';
const REDIRECT_URI = "https://rimworldo.github.io/SIMP/";
const ROOM_ID = `simp-room-daenil`;
let myName = '';
let isHost = false;
let isAdmin = false;
let bannedUsers = JSON.parse(localStorage.getItem('simpBanned') || '[]');
let hostPeer = null;
let clientPeer = null;
let clientConnections = []; // { conn: PeerConnection, name: string }

window.onload = checkTwitchAuth;

function checkTwitchAuth() {
    const hash = window.location.hash;
    const token = localStorage.getItem('simpTwitchToken');
    if (hash && hash.includes('access_token')) {
        const t = new URLSearchParams(hash.substring(1)).get('access_token');
        localStorage.setItem('simpTwitchToken', t);
        fetchTwitchUser(t);
    } else if (token) {
        fetchTwitchUser(token);
    } else {
        document.getElementById('twitchLoginOvl').classList.add('open');
    }
}

async function fetchTwitchUser(token) {
    try {
        const res = await fetch('https://api.twitch.tv/helix/users', { headers: { 'Authorization': `Bearer ${token}`, 'Client-Id': TWITCH_CLIENT_ID }});
        const data = await res.json();
        myName = data.data[0].login.toLowerCase();
        document.getElementById('twitchLoginOvl').classList.remove('open');
        initP2P();
    } catch(e) { localStorage.removeItem('simpTwitchToken'); window.location.reload(); }
}

function initP2P() {
    const HOST_NAMES = ['daenil', 'daniloamorimking'];
    isHost = HOST_NAMES.includes(myName);
    
    if (isHost) {
        document.getElementById('roleBadge').className = 'role-badge role-host';
        document.getElementById('roleBadge').textContent = '👑 HOST';
        startAsHost();
    } else {
        startAsClient();
    }
}

function startAsHost() {
    hostPeer = new Peer(ROOM_ID, { debug: 0 });
    hostPeer.on('open', () => {
        document.getElementById('clientsBadge').style.display = 'flex';
        updateClientsBadgeCount();
    });

    hostPeer.on('connection', (conn) => {
        const user = conn.metadata.username;
        
        // Verifica banimento
        if (bannedUsers.includes(user)) {
            conn.send({ type: 'banned' });
            conn.close();
            return;
        }

        conn.on('open', () => {
            clientConnections.push({ conn, name: user });
            updateClientsBadgeCount();
        });

        conn.on('close', () => {
            clientConnections = clientConnections.filter(c => c.conn !== conn);
            updateClientsBadgeCount();
        });
    });
}

function startAsClient() {
    clientPeer = new Peer({ debug: 0 });
    clientPeer.on('open', () => {
        const conn = clientPeer.connect(ROOM_ID, { metadata: { username: myName } });
        conn.on('data', (data) => {
            if (data.type === 'banned') {
                alert('Você foi banido desta sala.');
                window.location.href = 'about:blank';
            }
        });
    });
}

function updateClientsBadgeCount() {
    document.getElementById('clientsCount').textContent = clientConnections.length;
}

function openUsersModal() {
    const listDiv = document.getElementById('usersListContent');
    listDiv.innerHTML = '';
    
    // Adicionar a si mesmo (Host)
    const selfDiv = document.createElement('div');
    selfDiv.className = 'user-list-item';
    selfDiv.innerHTML = `<span>👑 ${myName} (Host)</span>`;
    listDiv.appendChild(selfDiv);

    // Adicionar Clientes
    clientConnections.forEach(c => {
        const div = document.createElement('div');
        div.className = 'user-list-item';
        const isBanned = bannedUsers.includes(c.name);
        
        div.innerHTML = `
            <span>${c.name} ${isBanned ? '🚫' : ''}</span>
            ${isHost ? `<button class="${isBanned ? 'btn-unban' : 'btn-ban'}" onclick="toggleBan('${c.name}')">${isBanned ? 'Desbanir' : 'Banir'}</button>` : ''}
        `;
        listDiv.appendChild(div);
    });

    document.getElementById('usersModal').classList.add('open');
}

function toggleBan(username) {
    if (bannedUsers.includes(username)) {
        bannedUsers = bannedUsers.filter(u => u !== username);
    } else {
        bannedUsers.push(username);
        // Desconecta se estiver conectado
        const connObj = clientConnections.find(c => c.name === username);
        if (connObj) {
            connObj.conn.send({ type: 'banned' });
            connObj.conn.close();
        }
    }
    localStorage.setItem('simpBanned', JSON.stringify(bannedUsers));
    openUsersModal(); // Recarrega o modal
}

document.getElementById('twitchLoginBtn').onclick = () => window.location.href = `https://id.twitch.tv/oauth2/authorize?client_id=${TWITCH_CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=user:read:email`;
document.getElementById('logoutBtn').onclick = () => { localStorage.removeItem('simpTwitchToken'); window.location.reload(); };
</script>
</body>
</html>
