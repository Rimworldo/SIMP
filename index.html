<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Simp.</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap"
            rel="stylesheet"
        />
        <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
        <style>
            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            :root {
                --bg: #0a0a0f;
                --surface: #12121a;
                --surface2: #1a1a26;
                --border: rgba(255, 255, 255, 0.07);
                --accent: #5e6cff;
                --text: #f0f0f5;
                --muted: #6b6b80;
                --item: #16161f;
                --hh: 58px;
            }
            body {
                background: var(--bg);
                color: var(--text);
                font-family: "Syne", sans-serif;
                min-height: 100vh;
                overflow-x: hidden;
            }
            header {
                height: var(--hh);
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 1.5rem;
                border-bottom: 1px solid var(--border);
                position: sticky;
                top: 0;
                z-index: 200;
                background: rgba(10, 10, 15, 0.95);
                gap: 0.75rem;
            }
            .logo {
                font-size: 1.5rem;
                font-weight: 800;
                letter-spacing: -0.02em;
                display: flex;
                align-items: center;
                gap: 10px;
            }
            .logo span {
                color: var(--accent);
            }
            .role-badge {
                font-size: 0.6rem;
                padding: 0.2rem 0.5rem;
                border-radius: 10px;
                font-family: "Space Mono";
                text-transform: uppercase;
                font-weight: bold;
                letter-spacing: 1px;
                background: #333;
            }
            .role-host {
                background: rgba(0, 170, 255, 0.2);
                color: #a78bfa;
                border: 1px solid #a78bfa;
            }
            .role-client {
                background: rgba(50, 200, 100, 0.2);
                color: #5de89a;
                border: 1px solid #5de89a;
            }
            .hright {
                display: flex;
                align-items: center;
                gap: 0.75rem;
            }
            .abtn {
                background: none;
                border: 1px solid var(--border);
                color: var(--muted);
                padding: 0.3rem 0.85rem;
                border-radius: 20px;
                font-family: "Space Mono", monospace;
                font-size: 0.7rem;
                cursor: pointer;
                transition: 0.2s;
            }
            .abtn:hover {
                border-color: var(--accent);
                color: var(--accent);
            }
            .abtn.on {
                border-color: var(--accent);
                color: var(--accent);
                background: rgba(248, 133, 41, 0.1);
            }
            .dropdown {
                position: relative;
                display: inline-block;
            }
            .dropdown-content {
                display: none;
                position: absolute;
                right: 0;
                top: 120%;
                background-color: var(--surface);
                min-width: 280px;
                box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.8);
                z-index: 300;
                border: 1px solid var(--border);
                border-radius: 8px;
                max-height: 350px;
                overflow-y: auto;
            }
            .dropdown-content.show {
                display: block;
                animation: fdIn 0.2s ease;
            }
            @keyframes fdIn {
                from {
                    opacity: 0;
                    transform: translateY(-10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            .plist-item {
                padding: 10px;
                border-bottom: 1px solid rgba(255, 255, 255, 0.03);
                display: flex;
                align-items: center;
                gap: 10px;
                cursor: pointer;
                transition: 0.2s;
            }
            .plist-item:hover {
                background-color: var(--surface2);
            }
            .plist-thumb {
                width: 45px;
                height: 26px;
                border-radius: 4px;
                object-fit: cover;
            }
            .plist-title {
                font-size: 0.75rem;
                font-weight: bold;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                flex: 1;
                color: var(--text);
            }
            .plist-del {
                background: none;
                border: none;
                color: var(--muted);
                cursor: pointer;
                padding: 5px;
                font-size: 0.8rem;
                border-radius: 4px;
            }
            .plist-del:hover {
                color: #ff5e5e;
                background: rgba(255, 94, 94, 0.1);
            }
            .tp {
                display: flex;
                align-items: center;
                gap: 0.4rem;
                background: rgba(0, 170, 255, 0.12);
                border: 1px solid rgba(0, 170, 255, 0.3);
                border-radius: 20px;
                padding: 0.28rem 0.75rem;
                font-family: "Space Mono", monospace;
                font-size: 0.7rem;
                color: #a78bfa;
            }
            .tdot {
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: #a78bfa;
                animation: blink 2s infinite;
            }
            @keyframes blink {
                0%,
                100% {
                    opacity: 1;
                }
                50% {
                    opacity: 0.3;
                }
            }
            .header-mid {
                flex: 1;
                min-width: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 0 0.5rem;
            }
            .log-ticker {
                flex: 1;
                min-width: 0;
                max-width: 100%;
                height: 28px;
                overflow: hidden;
                position: relative;
                margin: 0 1rem;
                border: 1px solid var(--border);
                border-radius: 20px;
                background: rgba(0, 0, 0, 0.35);
            }
            .log-ticker-inner {
                position: relative;
                width: 100%;
                height: 100%;
                overflow: hidden;
            }
            .cm {
                font-family: "Space Mono", monospace;
                font-size: 0.68rem;
                line-height: 1;
                display: inline-flex;
                align-items: center;
                gap: 0.35rem;
                position: absolute;
                top: 50%;
                left: 0;
                white-space: nowrap;
                will-change: transform, opacity;
                pointer-events: none;
                opacity: 0;
            }
            .cmu {
                color: #a78bfa;
                font-weight: 700;
            }
            .cmt {
                color: var(--muted);
            }
            main {
                display: grid;
                grid-template-columns: 1fr 350px;
                min-height: calc(100vh - var(--hh));
            }
            .theater {
                padding: 1.5rem;
                border-right: 1px solid var(--border);
                display: flex;
                flex-direction: column;
                gap: 1rem;
            }
            .theater-stage {
                position: relative;
                width: 100%;
            }
            .player-glow {
                position: absolute;
                inset: 0;
                background-size: cover;
                background-position: center;
                filter: blur(50px) saturate(200%);
                opacity: 0;
                transition: opacity 0.6s ease;
                z-index: 0;
                pointer-events: none;
                border-radius: 12px;
                transform: scale(1.05);
            }
            .player-glow.active {
                opacity: 0.25;
            }
            .player-wrap {
                background: #000;
                border-radius: 12px;
                overflow: hidden;
                position: relative;
                aspect-ratio: 16/9;
                border: 1px solid var(--border);
                width: 100%;
                z-index: 2;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            #ytFrame {
                width: 100%;
                height: 100%;
                border: none;
                display: block;
                pointer-events: none;
            }
            body.is-admin #ytFrame {
                pointer-events: auto;
            }
            #rawAudio {
                width: 90%;
                margin: auto;
                display: none;
                z-index: 5;
                position: relative;
            }
            .eover {
                position: absolute;
                inset: 0;
                background: rgba(10, 10, 15, 0.93);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 0.75rem;
                transition: opacity 0.3s;
                z-index: 3;
            }
            .eover.gone {
                opacity: 0;
                pointer-events: none;
            }
            .eover .ei {
                font-size: 2.5rem;
                opacity: 0.2;
            }
            .eover p {
                font-family: "Space Mono", monospace;
                font-size: 0.75rem;
                color: var(--muted);
                text-align: center;
                line-height: 1.8;
            }
            .eover .ec {
                color: var(--accent);
                background: var(--surface2);
                padding: 0.35rem 0.8rem;
                border-radius: 6px;
                font-size: 0.78rem;
                display: inline-block;
                margin-top: 0.2rem;
            }
            .sync-btn {
                background: var(--accent);
                color: #fff;
                border: none;
                padding: 10px 20px;
                border-radius: 8px;
                font-weight: bold;
                cursor: pointer;
                margin-top: 10px;
                display: none;
                animation: pulse 2s infinite;
            }
            @keyframes pulse {
                0% {
                    box-shadow: 0 0 0 0 rgba(248, 133, 41, 0.4);
                }
                70% {
                    box-shadow: 0 0 0 10px transparent;
                }
                100% {
                    box-shadow: 0 0 0 0 transparent;
                }
            }
            .npbar {
                display: flex;
                align-items: center;
                gap: 0.75rem;
                position: relative;
                z-index: 2;
            }
            .npi {
                flex: 1;
                min-width: 0;
            }
            .nplbl {
                font-family: "Space Mono", monospace;
                font-size: 0.6rem;
                color: var(--accent);
                letter-spacing: 0.18em;
                text-transform: uppercase;
                margin-bottom: 0.2rem;
            }
            .nptitle {
                font-size: 1rem;
                font-weight: 700;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .npuser {
                font-family: "Space Mono", monospace;
                font-size: 0.7rem;
                color: var(--muted);
            }
            .npuser b {
                color: #a78bfa;
                font-weight: 400;
            }
            .apanel {
                background: var(--surface);
                border: 1px solid rgba(248, 133, 41, 0.2);
                border-radius: 10px;
                padding: 1rem 1.25rem;
                display: none;
                flex-direction: column;
                gap: 0.75rem;
                position: relative;
                z-index: 2;
            }
            .apanel.show {
                display: flex;
            }
            .aptitle {
                font-family: "Space Mono", monospace;
                font-size: 0.6rem;
                color: var(--accent);
                letter-spacing: 0.15em;
                text-transform: uppercase;
            }
            .aprow {
                display: flex;
                align-items: center;
                gap: 0.6rem;
                flex-wrap: wrap;
            }
            .cbtn {
                background: var(--surface2);
                border: 1px solid var(--border);
                color: var(--text);
                padding: 0.45rem 0.9rem;
                border-radius: 7px;
                font-family: "Space Mono", monospace;
                font-size: 0.72rem;
                cursor: pointer;
                transition: 0.2s;
                display: flex;
                align-items: center;
                gap: 0.35rem;
                white-space: nowrap;
            }
            .cbtn:hover {
                background: var(--accent);
                border-color: var(--accent);
                color: #fff;
            }
            .cbtn.red:hover {
                background: #ff5e5e;
                border-color: #ff5e5e;
            }
            .volrow {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                flex: 1;
                min-width: 140px;
            }
            .volrow label {
                font-family: "Space Mono", monospace;
                font-size: 0.68rem;
                color: var(--muted);
            }
            .volrow input[type="range"] {
                flex: 1;
                accent-color: var(--accent);
                cursor: pointer;
            }
            .volnum {
                font-family: "Space Mono", monospace;
                font-size: 0.68rem;
                min-width: 30px;
                text-align: right;
            }
            .madd {
                border-top: 1px solid var(--border);
                padding-top: 0.7rem;
                display: flex;
                flex-direction: column;
                gap: 0.4rem;
            }
            .maddt {
                font-family: "Space Mono", monospace;
                font-size: 0.6rem;
                color: var(--muted);
                letter-spacing: 0.1em;
                text-transform: uppercase;
            }
            .cfg-row {
                display: flex;
                align-items: center;
                gap: 1rem;
                flex-wrap: wrap;
                background: rgba(0, 0, 0, 0.2);
                padding: 0.6rem 0.8rem;
                border-radius: 8px;
                border: 1px solid rgba(255, 255, 255, 0.03);
            }
            .cfg-row label {
                font-family: "Space Mono", monospace;
                font-size: 0.65rem;
                color: var(--text);
                display: flex;
                align-items: center;
                gap: 0.4rem;
                cursor: pointer;
            }
            .cfg-row input[type="number"] {
                background: var(--surface2);
                border: 1px solid var(--border);
                color: var(--text);
                border-radius: 4px;
                padding: 0.2rem 0.4rem;
                width: 45px;
                font-family: "Space Mono", monospace;
                font-size: 0.65rem;
                outline: none;
            }
            .cfg-row input[type="checkbox"] {
                accent-color: var(--accent);
                width: 14px;
                height: 14px;
                cursor: pointer;
            }
            .qside {
                display: flex;
                flex-direction: column;
                height: calc(100vh - var(--hh));
                position: sticky;
                top: var(--hh);
                overflow: hidden;
            }
            .qhead {
                padding: 1rem 1.25rem 0.7rem;
                border-bottom: 1px solid var(--border);
                display: flex;
                align-items: center;
                justify-content: space-between;
                flex-shrink: 0;
            }
            .qtitle {
                font-size: 0.8rem;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.08em;
                color: var(--muted);
            }
            .qcount {
                background: var(--accent);
                color: #fff;
                font-family: "Space Mono", monospace;
                font-size: 0.62rem;
                font-weight: 700;
                padding: 0.12rem 0.45rem;
                border-radius: 20px;
            }
            .user-add-box {
                display: flex;
                padding: 0.7rem 1.25rem;
                background: var(--surface);
                border-bottom: 1px solid var(--border);
                gap: 0.4rem;
                flex-shrink: 0;
            }
            .user-add-box input {
                flex: 1;
                background: var(--bg);
                border: 1px solid var(--border);
                border-radius: 6px;
                padding: 0.5rem 0.65rem;
                color: var(--text);
                font-family: "Space Mono", monospace;
                font-size: 0.7rem;
                outline: none;
                transition: 0.2s;
            }
            .user-add-box input:focus {
                border-color: var(--accent);
            }
            .user-add-box button {
                background: var(--accent);
                border: none;
                color: #fff;
                padding: 0.5rem 0.9rem;
                border-radius: 6px;
                font-weight: 700;
                cursor: pointer;
                transition: 0.2s;
            }
            .user-add-box button:hover {
                background: #d37322;
            }
            .qlist-wrap {
                flex: 1;
                position: relative;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }
            #qlistBg {
                position: absolute;
                inset: 0;
                background-size: cover;
                background-position: center;
                opacity: 0.1;
                z-index: 0;
                pointer-events: none;
                transition: background-image 0.5s ease;
            }
            .qlist {
                flex: 1;
                overflow-y: auto;
                padding: 0.7rem;
                display: flex;
                flex-direction: column;
                gap: 0.45rem;
                position: relative;
                z-index: 1;
            }
            .qlist::-webkit-scrollbar {
                width: 3px;
            }
            .qlist::-webkit-scrollbar-thumb {
                background: var(--border);
                border-radius: 3px;
            }
            .qi {
                background: #000;
                border: 1px solid var(--border);
                border-radius: 8px;
                padding: 0.6rem 0.7rem;
                display: flex;
                align-items: center;
                gap: 0.65rem;
                transition: border-color 0.2s;
                animation: qs 0.25s ease;
                position: relative;
                z-index: 1;
            }
            @keyframes qs {
                from {
                    opacity: 0;
                    transform: translateY(-6px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            .qi:hover {
                border-color: rgba(255, 255, 255, 0.12);
            }
            .qi.cur {
                border-color: var(--accent);
            }
            .qithumb {
                width: 68px;
                height: 40px;
                border-radius: 5px;
                background: var(--surface2);
                overflow: hidden;
                flex-shrink: 0;
                position: relative;
            }
            .qithumb img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }
            .qibody {
                flex: 1;
                min-width: 0;
            }
            .qititle {
                font-size: 0.78rem;
                font-weight: 700;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                line-height: 1.3;
            }
            .qiuser {
                font-family: "Space Mono", monospace;
                font-size: 0.62rem;
                color: #a78bfa;
                margin-top: 0.1rem;
            }
            .qinum {
                font-family: "Space Mono", monospace;
                font-size: 0.68rem;
                color: var(--muted);
                flex-shrink: 0;
            }
            .qidel,
            .qisave {
                background: none;
                border: none;
                color: var(--muted);
                cursor: pointer;
                font-size: 0.75rem;
                padding: 0.15rem 0.3rem;
                border-radius: 4px;
                transition: 0.2s;
                flex-shrink: 0;
                display: none;
            }
            .qi:hover .qidel,
            .qi:hover .qisave {
                display: flex;
            }
            .qidel:hover {
                color: #ff5e5e;
                background: rgba(255, 94, 94, 0.1);
            }
            .qisave:hover {
                color: #5de89a;
                background: rgba(50, 200, 100, 0.1);
            }
            .qempty {
                flex: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 0.5rem;
                color: var(--muted);
                text-align: center;
                padding: 2rem;
            }
            .qempty .qei {
                font-size: 2rem;
                opacity: 0.2;
            }
            .qempty p {
                font-family: "Space Mono", monospace;
                font-size: 0.7rem;
                line-height: 1.8;
            }
            .qempty .qc {
                color: var(--accent);
            }
            .ovl {
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.9);
                display: none;
                align-items: center;
                justify-content: center;
                z-index: 999;
            }
            .ovl.open {
                display: flex;
            }
            .modal {
                background: var(--surface);
                border: 1px solid rgba(248, 133, 41, 0.25);
                border-radius: 14px;
                padding: 2rem;
                width: 320px;
                text-align: center;
            }
            .modal h2 {
                font-size: 1.15rem;
                font-weight: 800;
                margin-bottom: 0.25rem;
            }
            .modal p {
                font-family: "Space Mono", monospace;
                font-size: 0.7rem;
                color: var(--muted);
                margin-bottom: 1.1rem;
                line-height: 1.7;
            }
            .toasts {
                position: fixed;
                bottom: 1.5rem;
                left: 50%;
                transform: translateX(-50%);
                z-index: 9999;
                display: flex;
                flex-direction: column;
                gap: 0.4rem;
                align-items: center;
                pointer-events: none;
            }
            .toast {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 8px;
                padding: 0.5rem 1.1rem;
                font-family: "Space Mono", monospace;
                font-size: 0.72rem;
                color: var(--text);
                white-space: nowrap;
                animation:
                    tin 0.3s ease,
                    tout 0.3s ease 2.4s forwards;
            }
            .toast.ok {
                border-color: rgba(50, 200, 100, 0.4);
                color: #5de89a;
            }
            .toast.err {
                border-color: rgba(255, 94, 94, 0.4);
                color: #ff5e5e;
            }
            @keyframes tin {
                from {
                    opacity: 0;
                    transform: translateY(8px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            @keyframes tout {
                to {
                    opacity: 0;
                }
            }
            .bok {
                background: var(--accent);
                color: #fff;
                padding: 0.6rem;
                border-radius: 7px;
                border: none;
                font-family: "Space Mono", monospace;
                font-size: 0.75rem;
                font-weight: 700;
                cursor: pointer;
                transition: 0.2s;
                width: 100%;
            }
            .bok:hover {
                background: #d37322;
            }
            .bcan {
                background: var(--surface2);
                color: var(--text);
                padding: 0.6rem;
                border-radius: 7px;
                border: none;
                font-family: "Space Mono", monospace;
                font-size: 0.75rem;
                font-weight: 700;
                cursor: pointer;
                transition: 0.2s;
                width: 100%;
                margin-top: 10px;
            }

            .u-item {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 0.5rem;
                border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            }
            .u-item:last-child {
                border-bottom: none;
            }
            .u-name {
                font-family: "Space Mono";
                font-size: 0.75rem;
                color: #a78bfa;
                font-weight: bold;
            }
            .u-btn {
                background: none;
                border: 1px solid #ff5e5e;
                color: #ff5e5e;
                font-family: "Space Mono";
                font-size: 0.6rem;
                padding: 0.2rem 0.5rem;
                border-radius: 4px;
                cursor: pointer;
                transition: 0.2s;
            }
            .u-btn:hover {
                background: rgba(255, 94, 94, 0.2);
            }
            .u-btn.unban {
                border-color: #5de89a;
                color: #5de89a;
            }
            .u-btn.unban:hover {
                background: rgba(50, 200, 100, 0.2);
            }

            @media (max-width: 760px) {
                main {
                    grid-template-columns: 1fr;
                }
                .qside {
                    height: auto;
                    position: static;
                    max-height: 420px;
                }

            // ===== PERSISTÊNCIA DA FILA (chave separada para não conflitar com a playlist salva) =====
            const QUEUE_STATE_KEY = "simpQueueState";
            function saveQueueState() {
                try {
                    localStorage.setItem(
                        QUEUE_STATE_KEY,
                        JSON.stringify({
                            queue: queue,
                            curIdx: curIdx,
                            paused: paused,
                            gifUrl: currentGifUrl,
                            time: getCurrentPlaybackTime(),
                            savedAt: Date.now(),
                        })
                    );
                } catch (e) {}
            }
            function loadQueueState() {
                try {
                    const raw = localStorage.getItem(QUEUE_STATE_KEY);
                    if (!raw) return null;
                    const data = JSON.parse(raw);
                    if (!data || !Array.isArray(data.queue)) return null;
                    return data;
                } catch (e) {
                    return null;
                }
            }
            function clearQueueState() {
                try {
                    localStorage.removeItem(QUEUE_STATE_KEY);
                } catch (e) {}
            }
            function getCurrentPlaybackTime() {
                if (curIdx < 0 || !queue[curIdx]) return 0;
                const isMp3 = /\.(mp3|wav|ogg|m4a)$/i.test(queue[curIdx].videoId);
                const rawAudio = document.getElementById("rawAudio");
                if (isMp3 && rawAudio) return rawAudio.currentTime || 0;
                try {
                    if (ytReady && ytPlayer && ytPlayer.getCurrentTime) return ytPlayer.getCurrentTime() || 0;
                } catch (e) {}
                return 0;
            }

            let emptySoundAudio = null;
            let queue = [];
            let curIdx = -1;
            let isAdmin = false;
            let isHost = false;
            let paused = false;
            let ytReady = false;
            let ytPlayer = null;
            let currentGifUrl = "";
            let clientSynced = false;
            let simpPlaylist = JSON.parse(localStorage.getItem("simpPlaylist") || "[]");
            let myName = "";
            let myTwitchName = "";
            let config = JSON.parse(localStorage.getItem("simpConfig") || "{}");
            if (!config.gifWords)
                config = {
                    gifWords: 3,
                    glow: true,
                    bpm: true,
                    vol: 80,
                    emptySound: true,
                    autoSkip: true,
                    maxDuration: 5,
                    maxPerViewer: 5,
                };
            if (config.maxPerViewer === undefined) config.maxPerViewer = 5;
            let simpsPoints = JSON.parse(localStorage.getItem("simpPoints") || "{}");
            let bannedUsers = JSON.parse(localStorage.getItem("simpBannedUsers") || "[]");
            let hostPeer = null;
            let clientPeer = null;
            let hostConnection = null;
            let clientConnections = [];
            let p2pInitializing = false;
            let clientCurrentVideoId = null;
            let clientLastSyncTime = 0;
            const SYNC_TOLERANCE_SEC = 5;
            let twitchMods = new Set();
            let twitchUsers = new Set(JSON.parse(localStorage.getItem("simpTwitchUsers") || "[]"));
            let twitchColors = JSON.parse(localStorage.getItem("simpTwitchColors") || "{}");
            let syncedActiveUsers = [];
            let twitchWs = null;
            let lastTwitchMessageTime = 0;
            const TWITCH_COOLDOWN_MS = 3000;
            let startSoundPlayed = false;
            let draggingSeek = false;
            let queueRestored = false; // evita double-restore

            // ===== RÁDIO AUTOMÁTICA =====
            const RADIO_KEY = "simpRadioHistory";
            const RADIO_MAX = 300;
            let radioHistory = [];
            try {
                radioHistory = JSON.parse(localStorage.getItem(RADIO_KEY) || "[]");
                if (!Array.isArray(radioHistory)) radioHistory = [];
            } catch (e) {
                radioHistory = [];
            }
            let radioRecent = [];
            let pendingStartTime = 0;

            function sfxVolume() {
                const v = Number(config.vol);
                return Math.min(1, Math.max(0, (isNaN(v) ? 80 : v) / 100));
            }
            function saveRadioHistory() {
                try {
                    localStorage.setItem(RADIO_KEY, JSON.stringify(radioHistory));
                } catch (e) {}
            }
            function addToRadioHistory(item) {
                if (!item || item.radio || !item.videoId) return;
                radioHistory = radioHistory.filter(function (h) {
                    return h.videoId !== item.videoId;
                });
                radioHistory.push({ videoId: item.videoId, title: item.title, thumb: item.thumb });
                if (radioHistory.length > RADIO_MAX) radioHistory = radioHistory.slice(-RADIO_MAX);
                saveRadioHistory();
            }
            function startRadio() {
                if (!isHost || config.radio === false || queue.length > 0 || !radioHistory.length) return false;
                let pool = radioHistory.filter(function (h) {
                    return !radioRecent.includes(h.videoId);
                });
                if (!pool.length) pool = radioHistory;
                const pick = pool[Math.floor(Math.random() * pool.length)];
                radioRecent.push(pick.videoId);
                while (radioRecent.length > Math.min(10, Math.floor(radioHistory.length / 2))) radioRecent.shift();
                queue.push({
                    videoId: pick.videoId,
                    title: pick.title,
                    thumb: pick.thumb,
                    user: "📻 Rádio",
                    color: null,
                    radio: true,

                    window.location.href = "about:blank";

            window.onload = function () {
                checkTwitchAuth();

                    rawAudio.onended = function () {

                }
            });

            // Salva o estado da fila ao sair/recarregar (apenas host manda)
            window.addEventListener("beforeunload", function () {
                if (isHost) saveQueueState();
            });

            function sanitizeColor(c) {
                if (!c) return "";
                if (c.match(/^#[0-9a-fA-F]{3,8}$/) || c.match(/^[a-zA-Z]+$/)) return c;
                return "#a78bfa";
            }

            function checkTwitchAuth() {
                const hash = window.location.hash;
                const storedToken = localStorage.getItem("simpTwitchToken");

                if (hash && hash.includes("access_token")) {
                    const params = new URLSearchParams(hash.substring(1));
                    const token = params.get("access_token");
                    window.location.hash = "";
                    localStorage.setItem("simpTwitchToken", token);
                    fetchTwitchUser(token);
                } else if (storedToken) {
                    fetchTwitchUser(storedToken);
                } else {
                    document.getElementById("twitchLoginOvl").classList.add("open");
                }
            }

            async function fetchTwitchUser(token) {
                document.getElementById("twitchLoginOvl").classList.add("open");
                document.querySelector("#twitchLoginOvl h2").textContent = "Conectando...";
                document.querySelector("#twitchLoginOvl p").textContent = "Validando sessão na Twitch...";
                document.getElementById("twitchLoginBtn").style.display = "none";

                try {
                    const res = await fetch("https://api.twitch.tv/helix/users", {
                        headers: { Authorization: `Bearer ${token}`, "Client-Id": TWITCH_CLIENT_ID },
                    });

                    if (res.status === 401) throw new Error("Token expirado");

                    const data = await res.json();

                    if (data.data && data.data.length > 0) {
                        const user = data.data[0];
                        myName = user.login.toLowerCase();

                        if (bannedUsers.includes(myName)) {
                            executeBanLoop();
                            return;
                        }

                        document.getElementById("twitchLoginOvl").classList.remove("open");
                        assignRolesAndStart();
                    } else {
                        throw new Error("Usuário não encontrado");
                    }
                } catch (e) {
                    localStorage.removeItem("simpTwitchToken");
                    toast("Sessão expirada. Faça login novamente.", "err");
                    document.querySelector("#twitchLoginOvl h2").textContent = "Simp. P2P";
                    document.querySelector("#twitchLoginOvl p").textContent =
                        "Você precisa logar com a Twitch para acessar a sala.";
                    document.getElementById("twitchLoginBtn").style.display = "block";
                }
            }

            function isUserAdminRole(username) {
                const lowerUser = username.toLowerCase();
                return lowerUser === "daenil" || ADMIN_USERS.includes(lowerUser) || twitchMods.has(lowerUser);
            }

            function banUser(targetUser) {
                if (!isHost) return;
                targetUser = targetUser.toLowerCase().replace("@", "");
                if (targetUser === myName || ADMIN_USERS.includes(targetUser) || targetUser === "daenil") {
                    toast("Você não pode banir este usuário!", "err");
                    return;
                }

                if (!bannedUsers.includes(targetUser)) {
                    bannedUsers.push(targetUser);
                    localStorage.setItem("simpBannedUsers", JSON.stringify(bannedUsers));
                }

                clientConnections.forEach(function (c) {
                    if (c.metadata && c.metadata.user === targetUser) {
                        c.send({ type: "banned" });
                        setTimeout(function () {
                            c.close();
                        }, 500);
                    }
                });

                logAdminAction(myName, `BANIU o usuário ${targetUser}`);
                renderUsersModal();
                broadcastState();
            }

            function unbanUser(targetUser) {
                if (!isHost) return;
                targetUser = targetUser.toLowerCase().replace("@", "");
                bannedUsers = bannedUsers.filter(function (u) {
                    return u !== targetUser;
                });
                localStorage.setItem("simpBannedUsers", JSON.stringify(bannedUsers));

                logAdminAction(myName, `DESBANIU o usuário ${targetUser}`);
                renderUsersModal();
                broadcastState();
            }

            document.getElementById("usersBtn").addEventListener("click", function () {
                renderUsersModal();
                document.getElementById("usersOvl").classList.add("open");
            });

            document.getElementById("usersClose").addEventListener("click", function () {
                document.getElementById("usersOvl").classList.remove("open");
            });

            function renderUsersModal() {
                const activeDiv = document.getElementById("activeUsersContent");
                const bannedDiv = document.getElementById("bannedUsersContent");
                const bannedSec = document.getElementById("bannedSection");

                activeDiv.innerHTML = "";

                let currentActive = isHost
                    ? clientConnections
                          .filter(function (c) {
                              return c.open && c.metadata;
                          })
                          .map(function (c) {
                              return c.metadata.user;
                          })
                    : syncedActiveUsers;

                if (currentActive.length === 0) {
                    activeDiv.innerHTML =
                        '<div style="color:var(--muted); font-size:0.7rem; text-align:center;">Nenhum cliente conectado.</div>';
                } else {
                    currentActive.forEach(function (u) {
                        const row = document.createElement("div");
                        row.className = "u-item";
                        row.innerHTML = `<span class="u-name">${esc(u)}</span> <button class="u-btn" data-user="${esc(u)}">BANIR</button>`;
                        activeDiv.appendChild(row);
                    });
                }

                if (isHost) {
                    bannedSec.style.display = "block";
                    bannedDiv.innerHTML = "";
                    if (bannedUsers.length === 0) {
                        bannedDiv.innerHTML =
                            '<div style="color:var(--muted); font-size:0.7rem; text-align:center;">Ninguém banido.</div>';
                    } else {
                        bannedUsers.forEach(function (u) {
                            const row = document.createElement("div");
                            row.className = "u-item";
                            row.innerHTML = `<span class="u-name" style="color:#5e6cff;">${esc(u)}</span> <button class="u-btn unban" data-user="${esc(u)}">UNBAN</button>`;
                            bannedDiv.appendChild(row);
                        });
                    }
                } else {
                    bannedSec.style.display = "none";
                }

                document.querySelectorAll("#activeUsersContent .u-btn").forEach(function (btn) {
                    btn.addEventListener("click", function () {
                        if (isHost) banUser(this.dataset.user);
                        else sendCmd("ban", { target: this.dataset.user });
                    });
                });

                if (isHost) {
                    document.querySelectorAll("#bannedUsersContent .u-btn").forEach(function (btn) {
                        btn.addEventListener("click", function () {
                            unbanUser(this.dataset.user);
                        });
                    });
                }
            }

                localStorage.setItem("simpConfig", JSON.stringify(config));

            function cleanTitleForGif(title) {
                return title
                    .toLowerCase()
                    .replace(/[^a-z0-9\s]/g, " ")
                    .replace(/\s+/g, " ")
                    .trim()
                    .split(" ")
                    .slice(0, config.gifWords)
                    .join(" ");
            }
            function getUserPoints(user) {
                return simpsPoints[user] || 0;
            }
            function addPoints(user, amount) {
                if (!user || !isHost) return;
                simpsPoints[user] = (simpsPoints[user] || 0) + amount;
                localStorage.setItem("simpPoints", JSON.stringify(simpsPoints));
            }
            function spendPoints(user, amount) {
                if (!user || getUserPoints(user) < amount) return false;
                simpsPoints[user] -= amount;
                localStorage.setItem("simpPoints", JSON.stringify(simpsPoints));
                return true;
            }
            function updateClientsBadge() {
                const badge = document.getElementById("clientsBadge");
                const count = document.getElementById("clientsCount");
                if (!isHost) {
                    badge.style.display = "none";
                    return;
                }
                badge.style.display = "flex";
                count.textContent = clientConnections.filter(function (c) {
                    return c.open;
                }).length;
            }

            async function getVideoDuration(id) {
                try {
                    const r = await fetch(`https://inv.nadeko.net/api/v1/videos/${id}`);
                    if (!r.ok) throw new Error("Falha");
                    const d = await r.json();
                    return d.lengthSeconds || 0;
                } catch (e) {
                    return 0;
                }
            }

                if (!isHost || !config.emptySound) return;

                    emptySoundAudio.pause();

                }
                const url = EMPTY_SOUNDS[Math.floor(Math.random() * EMPTY_SOUNDS.length)];
                emptySoundAudio = new Audio(url);
                emptySoundAudio.volume = sfxVolume();
                emptySoundAudio.play().catch(function () {});

                if (emptySoundAudio) {

                    emptySoundAudio = null;
                }
            }
            function esc(s) {
                return String(s)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;");
            }

            function destroyPeers() {
                clientConnections.forEach(function (c) {
                    try {
                        c.close();
                    } catch (e) {}
                });
                clientConnections = [];
                if (hostConnection) {
                    try {
                        hostConnection.close();
                    } catch (e) {}
                    hostConnection = null;
                }
                if (hostPeer) {
                    try {
                        hostPeer.destroy();
                    } catch (e) {}
                    hostPeer = null;
                }
                if (clientPeer) {
                    try {
                        clientPeer.destroy();
                    } catch (e) {}
                    clientPeer = null;
                }
            }

            function startAsHost() {
                if (p2pInitializing) return;
                p2pInitializing = true;
                isHost = true;
                destroyPeers();

                // Restaura a fila do localStorage antes de subir o peer
                if (!queueRestored) {
                    queueRestored = true;
                    const saved = loadQueueState();
                    if (saved && saved.queue.length > 0) {
                        queue = saved.queue;
                        curIdx = typeof saved.curIdx === "number" ? saved.curIdx : -1;
                        if (curIdx >= queue.length) curIdx = -1;
                        paused = !!saved.paused;
                        if (saved.gifUrl) currentGifUrl = saved.gifUrl;
                        renderQueue();
                        logChat(
                            "SISTEMA",
                            `♻️ Fila restaurada: ${queue.length} vídeo(s) na posição ${curIdx >= 0 ? curIdx + 1 : "—"}`,
                            true,
                            "#5de89a"
                        );
                    }
                }

                hostPeer = new Peer(ROOM_ID, {
                    debug: 0,
                    config: { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] },
                });

                hostPeer.on("open", function () {
                    p2pInitializing = false;
                    document.getElementById("roleBadge").textContent = `HOST (${myName})`;
                    document.getElementById("roleBadge").className = "role-badge role-host";
                    document.getElementById("eoverText").innerHTML = `Host iniciado.<br>Aguardando vídeos!`;
                    updateClientsBadge();
                    setupHost();

                    if (!startSoundPlayed) {
                        startSoundPlayed = true;
                        try {
                            const a = new Audio(START_SOUND_URL);
                            a.volume = sfxVolume();
                            a.play().catch(function () {});
                        } catch (e) {}
                    }

                    // Se tinha vídeo salvo tocando, retoma de onde parou
                    if (curIdx >= 0 && queue[curIdx]) {
                        const savedTime = loadQueueState() ? loadQueueState().time || 0 : 0;
                        startPlayback(curIdx, savedTime);
                    } else {
                        renderQueue();
                        startRadio();
                    }
                });

                hostPeer.on("error", function (err) {
                    p2pInitializing = false;
                    toast("Erro ao iniciar Host. O ID está ocupado.", "err");
                });
            }

            function startAsClient() {
                if (p2pInitializing) return;
                p2pInitializing = true;
                isHost = false;

                if (isAdmin) {
                    document.getElementById("roleBadge").textContent = "ADMIN";
                    document.getElementById("roleBadge").style.background = "rgba(255, 165, 0, 0.2)";
                    document.getElementById("roleBadge").style.color = "#ffb347";
                    document.getElementById("roleBadge").style.borderColor = "#ffb347";
                } else {
                    document.getElementById("roleBadge").textContent = "CLIENT";
                    document.getElementById("roleBadge").className = "role-badge role-client";
                }

                if (!isAdmin && !isHost) {
                    document.getElementById("eoverText").innerHTML = `Conectando ao Host...`;
                    document.getElementById("syncBtn").style.display = "block";
                    document.getElementById("eover").classList.remove("gone");
                } else {
                    document.getElementById("eoverText").innerHTML = `Tentando conectar ao host principal...`;
                    document.getElementById("syncBtn").style.display = "block";
                    document.getElementById("eover").classList.remove("gone");
                }

                if (clientPeer) {
                    try {
                        clientPeer.destroy();
                    } catch (e) {}
                    clientPeer = null;
                }

                if (!twitchWs || twitchWs.readyState !== WebSocket.OPEN) {
                    toast("Conectando ao Twitch chat...", "");
                    logChat("SISTEMA", "🔗 Conectando ao Twitch chat como cliente...", true, "#ffdd57");
                    connectTwitch();
                }

                clientPeer = new Peer({ debug: 0, config: { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] } });

                clientPeer.on("open", function () {
                    p2pInitializing = false;
                    setupClient();
                });

                clientPeer.on("error", function (err) {
                    p2pInitializing = false;
                    if (isHost) return;

                    if (err && err.type === "peer-unavailable") {
                        document.getElementById("eoverText").innerHTML = "Host ainda não iniciou. Aguardando...";
                        setTimeout(function () {
                            if (!isHost && clientPeer && !clientPeer.destroyed) setupClient();
                        }, 4000);
                        return;
                    }

                    toast("Erro de conexão. Tentando reconectar...", "err");
                    setTimeout(startAsClient, 4000);
                });
            }
